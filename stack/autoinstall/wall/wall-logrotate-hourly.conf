# /etc/systemd/system/logrotate.timer.d/60-wall-hourly.conf on the WALL PANEL
# -- installed by wall-firstboot.sh on every boot (SR-083).
#
# Runs the STOCK logrotate.service hourly instead of daily, so the `maxsize
# 100M` in wall-logrotate-rsyslog is honoured within the day rather than only
# at midnight. Running logrotate more often does not rotate anything more often
# than its own config says: each log's daily/weekly interval is judged against
# /var/lib/logrotate/status, so an hourly run only ever adds the size check.
#
# `OnCalendar=` is cleared first because it is a LIST: a drop-in that only says
# `OnCalendar=hourly` ADDS to the stock `daily` and both stay armed. The other
# two are single values and simply override. The stock timer's Persistent=true
# and its [Install] section are untouched, so it stays the distribution's timer
# with a shorter period.
[Unit]
Description=Hourly rotation of log files (wall panel: honours maxsize)

[Timer]
OnCalendar=
OnCalendar=hourly
AccuracySec=5min
RandomizedDelaySec=0
