# /etc/systemd/journald.conf.d/10-wall-cap.conf on the WALL PANEL --
# installed by wall-firstboot.sh on every boot, and journald is restarted only
# when this file changed (SR-083).
#
# THE SAME PATH AND THE SAME VALUES AS THE HAND-PLACED FILE IT REPLACES. On
# 2026-09-19 an ONNX Runtime warning flood had grown the journal to 2.8 GB in
# eight days under journald's computed default (10 % of the filesystem, about
# 9.8 GB there), and a drop-in with exactly these two caps was written on the
# panel by hand and the journal vacuumed to 495 MB (HomeHub FOLLOWUPS). Nothing
# in this repo carried it, so a reimage would have dropped it. Tracking it at
# the same file name makes this file take over that one in place, rather than
# stack a second drop-in beside it whose order would decide the cap -- and with
# the same numbers, so the live panel's behaviour does not change.
#
# 500M was chosen as a seatbelt against that flood and was measured then to
# hold only about ten hours of it; the flood itself has since been fixed in
# OfficeWallNaglight (sensors/face_core.py, log_severity_level=3). Raise
# SystemMaxUse here, deliberately, if the journal turns out too short now that
# rsyslog is masked on the panel (wall-firstboot.sh step 8f) and this journal
# is its only log store.
# SystemKeepFree=2G stops journald growing while the disk has less than 2 GB
# to give. Storage is persistent, as it already is on Ubuntu (/var/log/journal
# exists), so the evidence of a failed night survives the reboot that ends it.
#
# ForwardToSyslog=no is NOT here, on purpose: it lives in
# wall-journald-no-syslog.conf, installed under a name that sorts after
# systemd's own /usr/lib/systemd/journald.conf.d/syslog.conf. Drop-ins merge in
# file-name order across directories, so in THIS file (10-...) it would be
# overridden by that file's ForwardToSyslog=yes.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=2G
