# snd-aloop provides the loopback the trigger detector reads the kiosk's audio
# through. Index 2 keeps it clear of the pinned order in wall-audio-index.conf
# (built-in codec 0, USB adapter 1); a floating index would let ALSA's `default`
# drift onto the wrong card, which has happened here before.
# FOUR SUBSTREAMS SINCE 2026-09-13 (item 23 step 1), not one. Bus mode uses two
# of them: substream 0 is the merged bus, substream 1 is the post-switch speaker
# tap the amplifier detector reads. Two spare cost nothing (a substream is
# allocated lazily) and leave room for step 4 without another modprobe change,
# which would mean unloading the module under a running audio graph.
options snd-aloop index=2 pcm_substreams=4
