# caddy-guarded.conf — fail2ban filter for the password-guarded Caddy sites.
#
# WHAT IT WATCHES. /var/log/caddy/access.log, which only the guarded sites write
# to: the Caddyfile's (access_log) snippet is imported by admin.<domain> — the
# admin portal's sign-in host — and by the LLM gateway, and by nothing else.
# So every line in this file is already a request to a site whose front door is
# a credential, and there is no kiosk or tracker traffic to filter out first.
#
# CHANGED 2026-09-25, AND THE REGEX DID NOT HAVE TO (ADMIN_PORTAL_PLAN §4.3).
# This used to guard actual.<domain> and dns.<domain>, whose basic_auth answered
# a wrong password with 401. The admin portal removed that basic_auth — which
# would have left this jail quietly guarding nothing — and the sign-in host took
# over: a wrong password POSTed to admin.<domain>/oauth2/sign_in is ALSO a 401,
# and the line it logs matches the failregex below unchanged (proven against a
# real access-log line by HomeHub's admin-portal harness). The other admin sites
# do not import the log, and they turn "not signed in" into a 302 BEFORE it
# would be logged, so an ordinary visit without a cookie cannot count as a
# failure.
#
# ── 401 ONLY, AND 403 DELIBERATELY NOT (reversed 2026-08-29, same day) ────────
#
# This shipped hours earlier matching BOTH, on the reasoning that the remote_ip
# gate turns every internet attempt into a 403, so a 401-only filter would be
# inert against the WAN attacker the whole exercise was about. That reasoning was
# sound and the conclusion was still wrong, because it was weighed against the
# wrong cost.
#
# WHAT IT WOULD HAVE COST. The jail bans with `iptables-allports`, so a banned
# address loses EVERY published port - including tracker.<domain>, which the
# Owner needs to work from outside the network. The lockout path is entirely
# ordinary: away from home, type an admin name out of habit, get "LAN only",
# reload a dozen times wondering why. Fifteen of those inside ten minutes and the
# hotel's address is banned. SSH is not forwarded to the WAN, so there is no way
# to unban from there, and bantime.increment stretches a repeat to a week.
#
# WHAT BANNING A 403 ACTUALLY BOUGHT: almost nothing. That caller is already
# refused by the gate before any login exists for them - they have no prompt to
# attack and no way in. The ban saved a few CPU cycles and risked the one
# service that has to work remotely.
#
# So: 401 only. After the gate went in, a 401 can only come from a device already
# INSIDE the LAN - a compromised laptop, a guest, an IoT thing - which is the
# real remaining threat, and the one place the Owner has SSH to recover from.
# WAN probing is still fully RECORDED in this log; it is just not banned on.
#
# THE REGEX IS DELIBERATELY LOOSE ABOUT KEY ORDER. Caddy's JSON writer is not
# contractually ordered, and a filter that silently stops matching after a Caddy
# upgrade is worse than no filter. It requires request.remote_ip and a 401 on the
# same line, and nothing about their positions.

[Definition]

failregex = ^\{.*"remote_ip":"<HOST>".*"status":401[,}]

ignoreregex =

# Caddy logs `ts` as a float epoch, not a formatted date. Without this fail2ban
# falls back to "time of reading", which mostly works and then silently stops
# working the moment the log is read out of order or replayed after a restart.
datepattern = "ts":{EPOCH}

[Init]

# The file is 0600 root; fail2ban runs as root, so no ACL is needed. Named here
# so a future reader does not go looking for a permission grant that is absent
# on purpose.
maxlines = 1
