# Trigger mode — audio out the USB adapter, headphone jack carries the trigger
# tone for the amplifier's relay, panel's own speaker silent.
#
# Included by /etc/asound.conf via the /etc/wall-panel/audio-out.conf symlink.
# Switch with `wall-audio-mode trigger|panel`.

# Everything audible ends up here: the adapter's line out, to the amplifier.
pcm.speaker_shared {
    type dmix
    ipc_key 7710
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "hw:ICUSBAUDIO7D,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# The kiosk plays HERE rather than straight to speaker_shared, so that its audio
# passes through a loopback the detector can read. Without this the detector
# sees only the line input and the amplifier stays off whenever the panel plays
# its own music -- the kiosk's audio is digital and never reaches the line jack.
#
# Only the kiosk path takes this detour. The line-in passthrough goes directly
# to speaker_shared, so the latency lands on music rather than on desktop audio
# where it would break lip-sync.
pcm.kiosk_mix {
    type dmix
    ipc_key 7711
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "hw:Loopback,0,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# The other end of that loopback. Two readers attach: alsaloop, which forwards
# to the real output, and the trigger daemon, which only measures.
pcm.kiosk_monitor {
    type dsnoop
    ipc_key 8821
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "hw:Loopback,1,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# The amplifier's control line. Nothing audible is ever routed here.
pcm.trigger_out {
    type plug
    slave.pcm "hw:PCH,0"
}

pcm.!default {
    type plug
    slave.pcm "kiosk_mix"
}

ctl.!default {
    type hw
    card ICUSBAUDIO7D
}
