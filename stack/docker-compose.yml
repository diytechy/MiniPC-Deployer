# AWOW AK41 always-on core — the whole stack (host layout).
#
# Four services, all health-checked, all restart:unless-stopped so a reboot or a
# single crash self-heals with zero manual clicks (the WI-4.7 goal):
#   technitium  — split-horizon LAN DNS + recursion + blocklists + HTTP API
#   caddy       — reverse proxy + basic_auth + automatic TLS (valid on LAN via
#                 split-horizon)
#   tracker     — the NagLight web container (image naglight:local, WI-10.1/10.4)
#   actual      — Actual Budget (finances)
#   ddns        — Cloudflare dynamic-DNS updater (apex + wildcard A records
#                 follow the home IP; AWOW owns DDNS per WI-9 Q4)
#
# Every knob is in .env (copy .env.example -> .env). No secret or site-specific
# value is baked into this file; it is safe to commit.
#
# Networking model:
#   - Technitium binds host :53 (udp+tcp) so it is the LAN's DNS server, and
#     :5380 for its HTTP API/console. Host network because a DNS server must see
#     real client IPs for per-client rules and must own :53.
#   - Caddy publishes :80/:443 to the host for the reverse proxy + ACME.
#   - tracker and actual stay on the internal bridge; only Caddy reaches them.
#
# Provisioning (Technitium zero-touch) is done by provision/provision-technitium.sh,
# invoked by the first-boot systemd unit AFTER `docker compose up -d` — not here,
# because it talks to Technitium's HTTP API once the container is healthy.

services:
  technitium:
    image: technitium/dns-server:${TECHNITIUM_IMAGE_TAG}
    container_name: technitium
    hostname: dns
    # Host network: a resolver needs :53 on the LAN and the real client source IP.
    network_mode: host
    environment:
      # Technitium reads this on FIRST start to set the initial admin password,
      # so the box comes up already password-protected (no default-creds window).
      # provision-technitium.sh is still idempotent if the box was pre-seeded.
      DNS_SERVER_ADMIN_PASSWORD: ${TECHNITIUM_ADMIN_PASSWORD}
      DNS_SERVER_DOMAIN: ${DNS_HOSTNAME}
      # Bind the web console to all interfaces on :5380 (LAN-reachable for the API).
      DNS_SERVER_WEB_SERVICE_HTTP_PORT: "5380"
    volumes:
      - technitium_config:/etc/dns
    restart: unless-stopped
    healthcheck:
      # The technitium/dns-server image ships bash but NO wget/curl (verified in
      # the homehub-sim, WI-10.14), so probe the :5380 console port with bash's
      # /dev/tcp instead of wget — a tool-independent liveness check that only
      # succeeds once Technitium is listening.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5380"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    # NOT the stock caddy image — see stack/caddy/Dockerfile for why. Caddy's DNS
    # providers are compiled in, and this stack needs the Cloudflare one so ACME
    # can use dns-01 and stop depending on an inbound :80 that the router does
    # not forward. Built by scripts/ensure-local-images.sh, baked by
    # vmtest/export-images.sh like every other image.
    image: caddy-cloudflare:${CADDY_IMAGE_TAG}
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
      # The office-wall kiosk site (SR-016). Published bound to LAN_IP — NOT
      # 0.0.0.0 — so the port does not exist on the WAN side even if someone
      # later adds a router forward by mistake. This is half of the OI-12
      # "LAN port + /32" ratification; the other half is the Caddyfile's
      # remote_ip /32 matcher. Caddy inside the container listens on
      # 0.0.0.0:${WALL_PORT}; the LAN-binding is THIS publish, which is why the
      # Caddyfile carries no `bind` directive (LAN_IP is not an address the
      # container owns, so `bind` there would fail to listen at all).
      - "${LAN_IP}:${WALL_PORT}:${WALL_PORT}"
    environment:
      # Caddyfile is templated with these (see Caddyfile `{$VAR}` refs).
      DOMAIN: ${DOMAIN}
      LAN_IP: ${LAN_IP}
      TRACKER_HOST: ${TRACKER_SUBDOMAIN}.${DOMAIN}
      ACTUAL_HOST: ${ACTUAL_SUBDOMAIN}.${DOMAIN}
      # Office-wall kiosk site (SR-016). WALL_HOST is a T1 private name in the
      # real .env; PANEL_IP is the panel's DHCP-reserved address (/32 allow-list)
      # and PANEL_USER_SUB the NagLight identity this site injects.
      WALL_HOST: ${WALL_HOST}
      WALL_PORT: ${WALL_PORT}
      PANEL_IP: ${PANEL_IP}
      PANEL_USER_SUB: ${PANEL_USER_SUB}
      # basic_auth guards the SINGLE-USER services (Actual, dns console) only.
      # The tracker host is NOT basic_auth'd — oauth2-proxy owns its auth (D2).
      ACTUAL_BASICAUTH_USER: ${ACTUAL_BASICAUTH_USER}
      ACTUAL_BASICAUTH_HASH: ${ACTUAL_BASICAUTH_HASH}
      DNS_BASICAUTH_USER: ${DNS_BASICAUTH_USER}
      DNS_BASICAUTH_HASH: ${DNS_BASICAUTH_HASH}
      # Who may reach those two hosts AT ALL - the remote_ip matcher in front
      # of the basic_auth. Defaults to `private_ranges` in .env.example.
      LAN_CIDR: ${LAN_CIDR}
      ACME_EMAIL: ${ACME_EMAIL}
      # THE dns-01 CREDENTIAL. The Caddyfile's global `acme_dns cloudflare`
      # reads it; without it every issuance falls back to http-01 and needs a
      # router forward. Same token the ddns service uses (Zone:DNS:Edit), so
      # this adds no secret — but it does put it in a second container's
      # environment, which is worth knowing rather than discovering.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      MAIN_BOX_IP: ${MAIN_BOX_IP}
      # ── Gun Master 3 relay (GAME_RELAY_ENABLED) ──────────────────────────
      # GAME_HOST is a T1 private name; GAME_WS_SECRET is the PATH COMPONENT
      # that stands in for authentication on that host, and is the only thing
      # between the internet and the relay. See the Caddyfile's game block.
      #
      # THIS LINE IS THE ORACLE for the relay unit's secret check, and since
      # round 6 it is the ONLY one. homehub-gunmaster3-relay.service reads
      # GAME_WS_SECRET back out of THIS container's environment and has no .env
      # fallback at all, because the Caddyfile consumes {$GAME_WS_SECRET} from
      # here — so this is the value that actually gates the public path, and
      # validating anything else asserts what the door SHOULD be rather than
      # what it is. Delete this line and the relay unit fails its ExecStartPre
      # and refuses to start, which is the correct answer: with no secret in
      # caddy's environment there is no door.
      #
      # AND IT IS FIXED AT CREATE TIME. Editing GAME_WS_SECRET in .env changes
      # nothing about a running caddy; the container must be RECREATED
      # (`docker compose up -d --force-recreate caddy`) for a new value to reach
      # the Caddyfile. The relay unit's failure message says so.
      GAME_HOST: ${GAME_HOST}
      GAME_WS_SECRET: ${GAME_WS_SECRET}
    # TWO NETWORKS, and BOTH must be named explicitly. Naming any network at all
    # opts a service OUT of the implicit `default`, so omitting `default` here
    # would cut Caddy off from tracker, actual and oauth2-proxy in one edit — a
    # failure that presents as every site 502ing at once.
    networks:
      - default
      - game
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The wall shell's static build (SR-016 / IF-005). Read-only: Caddy serves
      # it, nothing writes it — the IMAGE populates the directory. Ships empty
      # (README only) until the OfficeWallNaglight artifact contract lands.
      - ./wall-shell:/srv/wall-shell:ro
      # THE ACCESS LOG fail2ban READS, and it is a BIND MOUNT rather than a
      # named volume on purpose: fail2ban runs on the HOST and has to be able to
      # tail the file. Only the two guarded sites log here (Caddyfile's
      # (access_log) snippet), so this stays small and the 401s are not buried
      # under every kiosk asset request.
      - /var/log/caddy:/var/log/caddy
      - caddy_data:/data       # certs + ACME account — persist so re-issue isn't needed on reboot
      - caddy_config:/config
    extra_hosts:
      # host.docker.internal is a Docker DESKTOP name — plain docker-ce (what the
      # AWOW runs) does not provide it unless mapped to the host gateway here.
      # Without this the dns.<domain> site (reverse_proxy host.docker.internal:5380)
      # 502s on the real box. The homehub-sim could not catch it: Caddyfile.sim
      # deliberately proxies the bridge container name instead (review 2026-07-10).
      - "host.docker.internal:host-gateway"
    depends_on:
      oauth2-proxy:
        # service_started (not _healthy): oauth2-proxy is distroless and carries
        # no container healthcheck (see its block). It waits for the tracker to be
        # healthy before starting, so start-order is still correct; Caddy tolerates
        # a brief 502 if it races ahead.
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # Caddy admin API on :2019 is always up when the process is; cheap liveness.
      # LIVENESS ONLY — it says nothing about what this container can SERVE, and
      # in particular nothing about whether it can READ /srv/wall-shell/config.json
      # (installed 0600 root:root; readable only because there is no `user:` here,
      # no USER in the pinned image and no daemon userns-remap). Add any of those
      # three and caddy stays `healthy` while the panel degrades to js/config.js
      # defaults in silence — `loadConfig` never throws. Note `:ro` above is NOT
      # the risk: it restricts writes, and this is a read. The readability
      # assertion lives in firstboot.sh step 4b, where the production source is
      # known to exist; a sim hub has no config.json and must stay healthy without
      # one, which is why it cannot be a condition in this healthcheck. See OI-20.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── oauth2-proxy — Google sign-in for the tracker subdomain (WI-10.2, D1/D2) ──
  # Stock upstream image; NO code repo of its own (D1). Caddy forwards the tracker
  # host here WITHOUT basic_auth; oauth2-proxy does the Google OAuth dance, then
  # reverse-proxies to the tracker container, injecting the verified identity
  # headers (X-Forwarded-Email / X-Forwarded-User) the tracker's trusted-header
  # multi-user mode consumes (D3, NagLight WI-10.5).
  #
  # OWNER MANUAL STEP (see README + .env.example): create a Google Cloud OAuth
  # 2.0 client and register the redirect URI before this can start.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_IMAGE_TAG}
    container_name: oauth2-proxy
    environment:
      # Provider + app credentials (from the Google Cloud OAuth client).
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      # 32-byte cookie encryption seed. Generate:
      #   openssl rand -base64 32 | tr -- '+/' '-_'
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      # Allow-list of Google accounts permitted through (Q10.5: explicit list to
      # start; a remote-settable console is a deferred FUTURE knob, not built).
      # The first-boot flow materializes this file from OAUTH2_PROXY_ALLOWED_EMAILS.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/authenticated-emails.txt
      # Listen on all bridge interfaces so Caddy can reach it.
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # The upstream oauth2-proxy protects and forwards to (the tracker container).
      OAUTH2_PROXY_UPSTREAMS: http://tracker:8787
      # Emit the identity headers to the upstream (D3 trusted-header mode).
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"       # X-Forwarded-User / -Email to upstream
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"        # X-Auth-Request-* headers too
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      # Public URL of the tracker (used to build the redirect + cookie domain).
      OAUTH2_PROXY_REDIRECT_URL: https://${TRACKER_SUBDOMAIN}.${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: ${TRACKER_SUBDOMAIN}.${DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${TRACKER_SUBDOMAIN}.${DOMAIN}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      # Behind Caddy's TLS termination — trust the X-Forwarded-* Caddy sets.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"              # gate on the allow-list file, not the domain
    volumes:
      # The allow-list file materialized from OAUTH2_PROXY_ALLOWED_EMAILS by the
      # first-boot flow (real accounts kept out of git; see .env.example + README).
      - ./oauth2-proxy/authenticated-emails.txt:/etc/oauth2-proxy/authenticated-emails.txt:ro
    depends_on:
      tracker:
        condition: service_healthy
    expose:
      - "4180"
    restart: unless-stopped
    # NO container healthcheck: the stock oauth2-proxy image is distroless — it
    # ships no shell and no wget/curl, so a CMD/CMD-SHELL probe can never run
    # (verified in the homehub-sim, WI-10.14). /ping DOES serve an unauthenticated
    # 200 for liveness; probe it from OUTSIDE the container (Caddy/Uptime-Kuma)
    # rather than via a container healthcheck. Caddy therefore waits only for this
    # service to START (below), and oauth2-proxy itself waits for the tracker to
    # be healthy before it starts, so ordering is still correct.

  tracker:
    # NagLight is the canonical build now (its repo owns the Dockerfile, WI-10.4).
    # LOCAL BUILD STEP (Q10.2: build locally, no registry yet). From a sibling
    # NagLight checkout run:
    #     docker build -t naglight:local ../NagLight
    # then `docker compose up -d` here consumes that image.
    image: naglight:${TRACKER_IMAGE_TAG}
    # FALLBACK — let compose build the image from a sibling ../NagLight checkout
    # instead of a pre-built tag. Uncomment if you'd rather `compose build` it.
    # (The deprecated reference Dockerfile under ./tracker is kept only for
    # history; NagLight's own Dockerfile is the source of truth.)
    # build:
    #   context: ../../NagLight
    #   dockerfile: deploy/tracker/Dockerfile
    container_name: tracker
    labels:
      # naglight:local has no registry home (Q10.2) — tell diun (tier-2 ops
      # profile, SR-012) not to look it up; every other image is watchable.
      - "diun.enable=false"
    environment:
      DATA_DIR: /data
      # If set, the entrypoint clones this remote into /data on first boot and
      # `git pull --rebase` on subsequent boots (the "clone of the data repo").
      # Leave blank to bind-mount a local data dir instead.
      TRACKER_DATA_REMOTE: ${TRACKER_DATA_REMOTE}
      TRACKER_GIT_NAME: ${TRACKER_GIT_NAME}
      TRACKER_GIT_EMAIL: ${TRACKER_GIT_EMAIL}
      # Passed to `tracker serve --commit` when true (nightly materialize commits).
      # Disabled for hosted multi-user mode (D3) — leave false when MULTI_USER=true.
      TRACKER_COMMIT: ${TRACKER_COMMIT}
      # Trusted-header multi-user opt-in (NagLight WI-10.5, D3). When true the
      # tracker takes identity from oauth2-proxy's X-Forwarded-Email header ONLY
      # and keys a per-user data dir off the Google `sub` claim.
      TRACKER_MULTI_USER: ${TRACKER_MULTI_USER}
      # Multi-user only: seed a brand-new user's definitions/ from this path.
      # BLANK in production (the entrypoint then passes no --seed at all) — see
      # .env.example. Set by the A19 gate so the two drive lanes the panel is
      # asserted on exist before the panel ever asks for them.
      TRACKER_SEED_DIR: ${TRACKER_SEED_DIR}
      # ── One-way traceability mirror (NagLight SN-024, the Owner 2026-08-09) ──
      # Commits ONE identity's data dir hourly and pushes it to a private repo,
      # so there is a record of how items changed. It is one-way BY
      # CONSTRUCTION: the remote's history is fetched once, its CONTENT never
      # is, and a diverged remote is reported rather than force-pushed or
      # pulled. The upstream service stays the source of truth.
      #
      # NOT THE SAME KNOB AS TRACKER_DATA_REMOTE ABOVE, and the two point in
      # OPPOSITE directions: that one clones/pulls the remote INTO /data
      # (single-user only). Setting both would be incoherent.
      #
      # BLANK = OFF, which is what ships. TRACKER_MIRROR_USER is REQUIRED
      # alongside the remote in multi-user mode: with no id the mirror refuses
      # to start rather than defaulting to the data root, because that default
      # would push every household member's private data into one repo.
      TRACKER_MIRROR_REMOTE: ${TRACKER_MIRROR_REMOTE}
      TRACKER_MIRROR_USER: ${TRACKER_MIRROR_USER}
      TRACKER_MIRROR_BRANCH: ${TRACKER_MIRROR_BRANCH}
      TRACKER_MIRROR_INTERVAL: ${TRACKER_MIRROR_INTERVAL}
      # The repo token. NagLight also reads TRACKER_MIRROR_TOKEN_FILE, which is
      # the stronger form (a 0400 mount is not in `docker inspect`) — the env
      # var is used here because it is what every other secret on this box
      # already does, so the file would add a mechanism without changing the
      # box's actual exposure. Revisit together with the others, not alone.
      TRACKER_MIRROR_TOKEN: ${TRACKER_MIRROR_TOKEN}
    volumes:
      - tracker_data:/data
      # Read-only, and inert unless TRACKER_SEED_DIR names it. The default
      # source (./tracker-seed) ships with no definitions/ subdirectory, so
      # mounting it can seed nothing even if the env var is set by mistake.
      - ${TRACKER_SEED_SRC:-./tracker-seed}:/seed:ro
    # expose (bridge-only), NOT ports: the tracker must never be reachable except
    # via oauth2-proxy (D2/WI-10.5 — trusted headers are forgeable if the port is
    # open). No host publish.
    expose:
      - "8787"
    restart: unless-stopped
    healthcheck:
      # /healthz is the identity-free liveness surface in BOTH single- and
      # multi-user mode (matches the NagLight Dockerfile HEALTHCHECK). It must NOT
      # be /api/today: in multi-user mode (TRACKER_MULTI_USER=true, the D3 hosted
      # default) every /api/* route requires the oauth2-proxy X-Forwarded-User
      # header, so a header-less probe to /api/today returns 403 and the container
      # would never report healthy. Surfaced by the homehub-sim (WI-10.14).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  actual:
    image: actualbudget/actual-server:${ACTUAL_IMAGE_TAG}
    container_name: actual
    environment:
      ACTUAL_PORT: "5006"
    volumes:
      - actual_data:/data
    expose:
      - "5006"
    restart: unless-stopped
    healthcheck:
      # The actual-server image ships bash but NO wget/curl (verified in the
      # homehub-sim, WI-10.14) — probe :5006 with bash's /dev/tcp instead of wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5006"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── finance-auditor — the daily finance audit pipeline (IF-004 ↔ FA IF-003) ──
  # Consumes the Finance-Auditor image (private sibling repo; resolver SR-006:
  #   bash scripts/ensure-local-images.sh   builds it with the ACTUAL_API_VERSION
  # build-arg pinned to ACTUAL_IMAGE_TAG — the IF-002 coupling: REBUILD this image
  # whenever the Actual pin bumps). Merged from FA's reference spec
  # (deploy/compose.service.example.yml, DEC-19).
  #
  # PROFILE-GATED until Finance-Auditor passes its G-Release (live TC-033) and
  # G-Final (7-day AWOW run) — then promote to core + the baked payload (SR-014).
  # No ports and no healthcheck ON PURPOSE (scheduled daemon, no listening
  # surface; "did today's status post" is the liveness signal and the tracker's
  # automated-lane aging is the backstop — see FA's Dockerfile).
  # PRIVACY (FA §3 firewall): raw finance data lives ONLY in the two volumes
  # below; never bake secrets/snapshots into the image; snapshots must NEVER
  # join OFFSITE_SETS (IceDrive is cloud) — LAN backup drive only.
  finance-auditor:
    image: finance-auditor:${FINANCE_AUDITOR_IMAGE_TAG}
    container_name: finance-auditor
    profiles: ["finance-auditor"]
    environment:
      TZ: ${TIMEZONE}                  # RUN_AT is read as BOX-LOCAL time (FA SR-001)
      RUN_AT: ${FINANCE_RUN_AT}
      # Actual over the compose-internal bridge ONLY (FA IF-002/SR-003) — never
      # the public actual.<domain> route.
      ACTUAL_URL: http://actual:5006
      ACTUAL_SYNC_ID: ${FINANCE_ACTUAL_SYNC_ID}
      ACTUAL_PASSWORD: ${FINANCE_ACTUAL_PASSWORD}
      # Tracker feed (FA IF-001) — bridge-internal, bearer-token'd. NOTE: in
      # multi-user tracker mode (D3) direct /api/* posts also need an
      # X-Forwarded-User header, which FA's feed client does not send yet —
      # fine single-user; recorded as an FA gap for multi-user boxes.
      TRACKER_FEED_URL: http://tracker:8787/api/feed
      TRACKER_FEED_TOKEN: ${FINANCE_TRACKER_FEED_TOKEN}
    volumes:
      - finance_snapshots:/snapshots          # LAN-only audit artifacts (FA SR-005/006)
      - finance_actual_data:/data/actual      # @actual-app/api cache — persist across restarts
    depends_on:
      actual:
        condition: service_healthy
      tracker:
        condition: service_healthy
    restart: unless-stopped

  # ── filebackup — the LIBRARY backup, as a ONE-SHOT container (E2 / P1.1) ─────
  # The bash service in stack/backup/ keeps cifs ingest, the volume: sets, the
  # Mini-serv set, WoL and drive power. THIS takes the nine library `path:` sets
  # — the 4 TB tree that is not archived at all today — with per-file dedup and
  # Snapshot_<date> history instead of eight full copies. A merge, not a swap.
  #
  # IT IS NEVER STARTED BY `docker compose up -d`, AND THAT IS THE POINT. The
  # `filebackup` profile is deliberately absent from COMPOSE_PROFILES in
  # .env.example and must stay absent from every materialised .env: firstboot
  # runs a plain `up -d`, and a profiled-in backup service would launch a
  # multi-day library backup on a box that was imaged ten minutes ago. The only
  # thing that ever starts it is stack/backup/library-backup.sh:
  #     docker compose --profile filebackup run --rm -T filebackup backup
  # (`-T` because a systemd oneshot has no TTY). The image still reaches the ISO
  # payload — vmtest/export-images.sh enables this profile unconditionally for
  # the bake, exactly as it already does for ntfy.
  #
  # NO `container_name:` and NO `restart:`, both deliberate. `compose run` mints
  # its own throwaway container name, and a fixed one would collide with it; a
  # restart policy on a one-shot would re-run the backup forever.
  #
  # HARDENING IS FileBackup's OWN (compose.example.yaml at its HEAD): non-root
  # 65532 (the uid Q-FB5 grants the backup drive via the fstab's uid=/gid=), a
  # read-only rootfs with a tmpfs /tmp, no network at all, and no capabilities.
  # `network_mode: none` is why reporting cannot live inside this container —
  # the wrapper posts to NagLight after it exits.
  #
  # EVERY HOST PATH CARRIES ITS DEFAULT INLINE, unlike MEDIA_ROOT above. An
  # unset knob would interpolate to empty and leave `:/source:ro`, which is not
  # a legal bind — and that does not merely break this service, it makes the
  # WHOLE FILE unparseable, taking `docker compose config` down with it. Two
  # things depend on that command succeeding: firstboot's bind-source
  # pre-creation (step 4a-pre-2) and export-images.sh's image resolution. So a
  # materialised .env that predates these knobs degrades to the documented
  # defaults instead of bricking bring-up. The knobs are still declared in
  # .env.example (and in HomeHub's FieldSchema) — the defaults are the floor,
  # not the interface.
  filebackup:
    image: filebackup:${FILEBACKUP_IMAGE_TAG}
    profiles: ["filebackup"]
    user: "65532:65532"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Both are already ENV in the image; naming them here keeps the contract
      # visible at the seam rather than one `docker image inspect` away.
      FILEBACKUP_CONFIG_PATH: /config/FileBackup.json
      FILEBACKUP_LOG_PATH: /logs/Backup_Global.log
    volumes:
      # The set definition — container-internal paths only, no secret and no
      # site identity, so it is a TRACKED template (stack/backup/filebackup.json)
      # installed to /etc by autoinstall late-command 5c, not a site artifact.
      - /etc/homehub-backup/filebackup.json:/config/FileBackup.json:ro
      # The library, READ-ONLY. FileBackup reads the source in place — there is
      # no staging copy for these sets, which is the NVMe staging bomb that this
      # service's arrival dissolves.
      - ${FILEBACKUP_SOURCE:-/srv/library}:/source:ro
      # Manifest/hash cache. On the SYSTEM disk on purpose: it is small, and it
      # must survive a backup drive being unplugged.
      - ${FILEBACKUP_STATE:-/var/lib/homehub-filebackup/state}:/state
      # The mirror (Q-FB1: PreserveFolderTree) and the snapshot history, both on
      # the backup drive.
      - ${FILEBACKUP_BACKUP:-/mnt/backup-drive/library}:/backup
      - ${FILEBACKUP_CHANGES:-/mnt/backup-drive/library-changes}:/changes
      - ${FILEBACKUP_LOGS:-/var/log/homehub-filebackup}:/logs
    tmpfs:
      # read_only: true leaves the process no writable scratch at all; pwsh
      # needs one. noexec/nosuid/nodev so it cannot become a foothold.
      - /tmp:rw,noexec,nosuid,nodev

  # ── ddns — keep the public A records pointed at the home connection ──────────
  # Gap the Owner caught 2026-07-04: DDNS previously ran on Mini-serv as the legacy
  # DDNS-Cloudflare-PowerShell scripts; per WI-9 Q4 the AWOW owns it now, and the
  # stack had no updater at all. Without this, a home-IP change strands the whole
  # external path (Caddy/ACME included).
  # Updates the apex AND the wildcard record so every subdomain follows along.
  # Healthcheck: inherited from the image (distroless; it ships its own
  # HEALTHCHECK binary — do not add a CMD-SHELL probe, there is no shell).
  # Web UI is deliberately NOT published; logs via `docker logs ddns` / Dozzle.
  ddns:
    image: qmcgaw/ddns-updater:${DDNS_IMAGE_TAG}
    container_name: ddns
    environment:
      PERIOD: ${DDNS_PERIOD}
      UPDATE_COOLDOWN_PERIOD: 5m
      PUBLICIP_FETCHERS: all
      LISTENING_ADDRESS: ":8000"
      CONFIG: >-
        {"settings":[
        {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"${DOMAIN}","ttl":300,"token":"${CLOUDFLARE_API_TOKEN}","ip_version":"ipv4"},
        {"provider":"cloudflare","zone_identifier":"${CLOUDFLARE_ZONE_ID}","domain":"*.${DOMAIN}","ttl":300,"token":"${CLOUDFLARE_API_TOKEN}","ip_version":"ipv4"}
        ]}
    # RESOLVE THROUGH A PUBLIC RESOLVER, NOT THIS BOX'S. Added 2026-08-08 after
    # the container sat `unhealthy` with a FailingStreak of 37 while doing its
    # job perfectly.
    #
    # ddns-updater's healthcheck resolves ${DOMAIN} and compares the answer with
    # the public IP it just pushed. By default that lookup goes through the
    # host's resolver — which is Technitium, which is SPLIT-HORIZON and answers
    # with the LAN address by design. So the check compared the LAN IP against
    # the WAN IP, found them different, and reported unhealthy forever:
    #     lookup IP addresses do not match: <lan ip> instead of <wan ip>
    # The updates themselves were landing at Cloudflare every ten minutes
    # throughout. The split-horizon design and the healthcheck's assumption are
    # each correct and cannot both be satisfied from the same resolver.
    #
    # Pointing it outward makes the check MEAN something instead of merely
    # passing: it becomes "the public record matches this connection's public
    # IP", which is TC-H-I02 in docs/LAB_TEST_PLAN.md, asserted continuously by
    # the container itself. A stale public record is exactly the failure a DDNS
    # updater exists to prevent and the only one it could not previously see.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - ddns_data:/updater/data
    restart: unless-stopped

  # ── Auxiliary LAN-only observability (WI-10.11) ───────────────────────────────
  # These management UIs are published bound to the box's LAN_IP only (not to
  # 0.0.0.0), so they are reachable on the LAN but NOT proxied to the public
  # internet and NOT forwarded by the router. Do NOT add Caddy sites for them.

  # Uptime-Kuma — generic up-checks (can also POST to NagLight /api/feed).
  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIMEKUMA_IMAGE_TAG}
    container_name: uptime-kuma
    volumes:
      - uptimekuma_data:/app/data
    ports:
      - "${LAN_IP}:${UPTIMEKUMA_PORT}:3001"   # LAN-only: bound to the box's LAN IP
    restart: unless-stopped
    healthcheck:
      # The uptime-kuma image ships NO wget (it has curl + bash; verified against
      # the pinned 1.23.17 image, 2026-08-01) — the old wget probe could never
      # run, so the container sat permanently unhealthy. The image already
      # declares its own HEALTHCHECK, `CMD-SHELL extra/healthcheck`, a compiled
      # Go binary at /app/extra/healthcheck that GETs http://127.0.0.1:3001 and
      # exits 0 on a 200. Use that same binary in exec form (absolute path, so it
      # does not depend on WorkingDir) and keep this stack's house cadence rather
      # than the image's slower 60s/180s defaults.
      test: ["CMD", "/app/extra/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Dozzle — live container log viewer (reads the docker socket read-only).
  dozzle:
    image: amir20/dozzle:${DOZZLE_IMAGE_TAG}
    container_name: dozzle
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${LAN_IP}:${DOZZLE_PORT}:8080"       # LAN-only: bound to the box's LAN IP
    restart: unless-stopped
    healthcheck:
      # The dozzle image is DISTROLESS — no /bin/sh, no wget (verified against the
      # pinned v8.14.12 image, 2026-08-01), so the old CMD-SHELL probe could never
      # run and the container sat permanently unhealthy. Unlike uptime-kuma the
      # image declares no HEALTHCHECK of its own, so we must supply one: the
      # dozzle binary ships a `healthcheck` subcommand that requests its own
      # /healthcheck endpoint and exits 0/1. CMD (exec) form is mandatory here —
      # any CMD-SHELL variant needs a shell this image does not have. Bonus: the
      # subcommand reads the same DOZZLE_ADDR config as the server, so it follows
      # the listen port automatically instead of hardcoding 8080.
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ntfy — OPTIONAL self-hosted push notifications (currently external). Opt-in:
  # starts only with `docker compose --profile ntfy up -d`. LAN-only like the rest.
  ntfy:
    image: binwiederhier/ntfy:${NTFY_IMAGE_TAG}
    container_name: ntfy
    profiles: ["ntfy"]
    command: serve
    environment:
      NTFY_BASE_URL: http://${LAN_IP}:${NTFY_PORT}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "false"
    volumes:
      - ntfy_data:/var/lib/ntfy
      - ntfy_cache:/var/cache/ntfy
    ports:
      - "${LAN_IP}:${NTFY_PORT}:80"           # LAN-only: bound to the box's LAN IP
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════
  # TIER-2 OPT-IN CATALOG (SR-012, review 2026-07-10) — everything below is OFF
  # by default. Each service sits behind a compose profile (the ntfy pattern):
  # nothing here starts, is health-gated, or is baked into the ISO payload unless
  # its profile is enabled (COMPOSE_PROFILES in .env, or `--profile NAME up -d`).
  #
  # Ground rules for this tier:
  #   - LAN-only UIs bind ${LAN_IP} (the WI-10.11 pattern); public exposure is a
  #     deliberate second step: uncomment the matching Caddyfile site AND add the
  #     label to EXTRA_SUBDOMAINS in .env (split-horizon record).
  #   - Image pins are best-effort as of 2026-07 authoring and are NOT part of
  #     the sim-validated set — VERIFY the tag at enable time; the diun profile
  #     watches them afterwards.
  #   - NO custom healthchecks yet: which probe tooling each image ships is
  #     unverified (the WI-10.14 lesson — check empirically at enable time);
  #     image-inherited HEALTHCHECKs still apply.
  #   - Media libraries live under ${MEDIA_ROOT} on the HOST — bind mounts, not
  #     named volumes, so libraries can sit on real storage. NOTE the tension:
  #     serving media from the WI-10.10 backup drives would defeat their
  #     spin-down policy; media wants its own always-on disk or a LAN share.
  #   - RAM budget (8 GB box): the core uses ~1.5 GB. HA + Jellyfin + the small
  #     services fit comfortably. Run AT MOST ONE photo stack; Immich's ML
  #     container is a separate profile (immich-ml) — leave it off on the J4125,
  #     or run it with IMMICH_ML_MEM_LIMIT set so it can only OOM itself. The
  #     full immich+immich-ml+jellyfin set lands around 4-5 GB on top of the
  #     core: it fits 7.6 GB usable, with little headroom for a library scan.
  #   - HARDWARE-CONDITIONAL BITS DO NOT BELONG IN THIS FILE. A `devices:` entry
  #     for a node that is absent fails container creation and takes the whole
  #     `compose up` with it. provision-compose-overrides.sh (firstboot 3c)
  #     generates docker-compose.override.yml from what the box actually has.
  #   - Tier-2 volumes are NOT yet covered by the backup service (open review
  #     finding — stack volumes generally aren't; see docs/status.md).

  # ── photos, option A: Immich (Google-Photos-style; mobile auto-backup) ───────
  # Enable: profile `immich` (server+db+redis). Semantic search/face ML is the
  # separate `immich-ml` profile — heavy; leave off on the J4125 or cap memory.
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_IMAGE_TAG}
    container_name: immich-server
    profiles: ["immich"]
    environment:
      TZ: ${TIMEZONE}
      DB_HOSTNAME: immich-db
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE}
      REDIS_HOSTNAME: immich-redis
      # false unless the immich-ml profile is also enabled.
      IMMICH_MACHINE_LEARNING_ENABLED: ${IMMICH_ML_ENABLED}
    volumes:
      - ${MEDIA_ROOT}/immich:/data
    ports:
      - "${LAN_IP}:${IMMICH_PORT}:2283"   # LAN UI/API; public = Caddyfile photos.* site
    depends_on:
      - immich-redis
      - immich-db
    restart: unless-stopped

  # Name matches immich-server's built-in default ML URL (http://immich-machine-learning:3003).
  # MEMORY CAP (IMMICH_ML_MEM_LIMIT) — this is the one tier-2 container that can
  # realistically OOM an 8 GB box: CLIP + face recognition hold their models
  # resident, and an initial library scan is the worst case. The cap is what the
  # tier-2 banner means by "or cap memory": the kernel OOM-kills THIS container
  # instead of letting the kernel pick a victim from the core stack, and
  # `restart: unless-stopped` brings it back. Smart search degrades; DNS, Caddy
  # and the tracker do not go down with it. Empty = no limit.
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_IMAGE_TAG}
    container_name: immich-machine-learning
    profiles: ["immich-ml"]
    mem_limit: ${IMMICH_ML_MEM_LIMIT:-0}
    volumes:
      - immich_model_cache:/cache
    restart: unless-stopped

  immich-redis:
    image: valkey/valkey:${IMMICH_REDIS_IMAGE_TAG}
    container_name: immich-redis
    profiles: ["immich"]
    restart: unless-stopped

  immich-db:
    # Immich's own curated Postgres image (vectorchord) — tag must track the
    # IMMICH_IMAGE_TAG line's release notes on bumps.
    image: ghcr.io/immich-app/postgres:${IMMICH_DB_IMAGE_TAG}
    container_name: immich-db
    profiles: ["immich"]
    environment:
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: ${IMMICH_DB_DATABASE}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - immich_db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped

  # ── photos, option B: PhotoPrism (indexes-in-place; lighter; single-user free) ─
  # Point it at an existing library: it indexes ${MEDIA_ROOT}/photos where it
  # lives (no import). Pair with the syncthing profile for phone→box transfer.
  photoprism:
    image: photoprism/photoprism:${PHOTOPRISM_IMAGE_TAG}
    container_name: photoprism
    profiles: ["photoprism"]
    environment:
      PHOTOPRISM_ADMIN_PASSWORD: ${PHOTOPRISM_ADMIN_PASSWORD}
      PHOTOPRISM_SITE_URL: http://${LAN_IP}:${PHOTOPRISM_PORT}/
      PHOTOPRISM_DATABASE_DRIVER: mysql
      PHOTOPRISM_DATABASE_SERVER: photoprism-db:3306
      PHOTOPRISM_DATABASE_NAME: photoprism
      PHOTOPRISM_DATABASE_USER: photoprism
      PHOTOPRISM_DATABASE_PASSWORD: ${PHOTOPRISM_DB_PASSWORD}
    volumes:
      - ${MEDIA_ROOT}/photos:/photoprism/originals
      - photoprism_storage:/photoprism/storage
    ports:
      - "${LAN_IP}:${PHOTOPRISM_PORT}:2342"
    depends_on:
      - photoprism-db
    restart: unless-stopped

  photoprism-db:
    image: mariadb:${PHOTOPRISM_DB_IMAGE_TAG}
    container_name: photoprism-db
    profiles: ["photoprism"]
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"
      MARIADB_DATABASE: photoprism
      MARIADB_USER: photoprism
      MARIADB_PASSWORD: ${PHOTOPRISM_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${PHOTOPRISM_DB_PASSWORD}
    volumes:
      - photoprism_db:/var/lib/mysql
    restart: unless-stopped

  # ── video: Jellyfin (movies/TV; music too if you skip Navidrome) ──────────────
  # LIBRARY PATH: JELLYFIN_LIBRARY_DIR lets a box hand Jellyfin the video subtree
  # instead of the whole media root — least privilege, and it makes the in-app
  # library path unambiguous (it is always /media). Unset/empty = the whole
  # ${MEDIA_ROOT}, which is the generic default.
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_IMAGE_TAG}
    container_name: jellyfin
    profiles: ["jellyfin"]
    environment:
      TZ: ${TIMEZONE}
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${JELLYFIN_LIBRARY_DIR:-${MEDIA_ROOT}}:/media:ro
    # NO `devices:` BLOCK HERE ON PURPOSE. Quick Sync (VA-API) needs /dev/dri,
    # and a devices: entry for a node that does not exist fails container
    # CREATION — which fails the whole `docker compose up -d`, not just Jellyfin.
    # provision-compose-overrides.sh (firstboot step 3c) writes a
    # docker-compose.override.yml adding /dev/dri on boxes that HAVE an iGPU
    # (the AWOW's J4125 does, via i915) and removes it on boxes that do not
    # (Hyper-V VMs). Compose auto-loads that file, so nothing else changes.
    # Prefer direct-play regardless; this is no 4K transcoding box.
    ports:
      - "${LAN_IP}:${JELLYFIN_PORT}:8096"
    restart: unless-stopped

  # ── music: Navidrome (Subsonic API — pick any client app) ────────────────────
  navidrome:
    image: deluan/navidrome:${NAVIDROME_IMAGE_TAG}
    container_name: navidrome
    profiles: ["navidrome"]
    environment:
      ND_MUSICFOLDER: /music
    volumes:
      - navidrome_data:/data
      # CAPITAL M, AND IT IS LOAD-BEARING — fixed 2026-08-30 (open-items C38).
      # The library folder is `Music`. This line said `music`, which cost nothing
      # while the stand-in drives were exFAT (case-insensitive) and broke the
      # moment the real NTFS library went in: docker CREATES a missing bind
      # source, so it made an empty `Media/music` beside the real `Media/Music`
      # and navidrome indexed the empty one — 0 tracks, container healthy, no
      # error anywhere. Two directories, two inodes, one of them a decoy.
      # storage-map §3 row 2, BACKUP_SOURCES and the panel's sync-music all say
      # `Music`; this was the only line that disagreed.
      - ${MEDIA_ROOT}/Music:/music:ro
    ports:
      - "${LAN_IP}:${NAVIDROME_PORT}:4533"
    restart: unless-stopped

  # ── podcasts + audiobooks: Audiobookshelf (subscribe/auto-download/track) ─────
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:${AUDIOBOOKSHELF_IMAGE_TAG}
    container_name: audiobookshelf
    profiles: ["audiobookshelf"]
    environment:
      TZ: ${TIMEZONE}
    volumes:
      - audiobookshelf_config:/config
      - audiobookshelf_metadata:/metadata
      - ${MEDIA_ROOT}/audiobooks:/audiobooks
      - ${MEDIA_ROOT}/podcasts:/podcasts
    ports:
      - "${LAN_IP}:${AUDIOBOOKSHELF_PORT}:80"
    restart: unless-stopped

  # ── passwords: Vaultwarden (Bitwarden-compatible server) ─────────────────────
  # Deliberately NO LAN port: the Bitwarden clients refuse plain HTTP, so the
  # ONLY sane ingress is the Caddyfile vault.* site (TLS). Enabling this profile
  # without uncommenting that site gives you a container nothing can reach.
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_IMAGE_TAG}
    container_name: vaultwarden
    profiles: ["vaultwarden"]
    environment:
      DOMAIN: https://vault.${DOMAIN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED}
      # ADMIN_TOKEN deliberately unset — the /admin panel stays disabled. Set it
      # (argon2 hash, see vaultwarden wiki) only while you actively need it.
    volumes:
      - vaultwarden_data:/data
    expose:
      - "80"
    restart: unless-stopped

  # ── home automation: Home Assistant (container flavor) + Mosquitto (MQTT) ────
  # Container flavor = NO supervisor/add-on store (that path is deprecated
  # upstream anyway); companions run as sibling containers like mosquitto below.
  # Host network (like technitium): HA's device discovery needs mDNS/SSDP
  # broadcasts, so it binds :8123 on all interfaces — HA's own login is the gate.
  # Public exposure later = Caddyfile home.* site + trusted_proxies in HA's config.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HOMEASSISTANT_IMAGE_TAG}
    container_name: homeassistant
    profiles: ["homeassistant"]
    network_mode: host
    environment:
      TZ: ${TIMEZONE}
    volumes:
      - homeassistant_config:/config
    restart: unless-stopped

  # Zigbee2MQTT is the natural third leg once a coordinator stick exists — not
  # defined here (hardware-dependent; add it when the stick is real).
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_IMAGE_TAG}
    container_name: mosquitto
    profiles: ["mosquitto"]
    volumes:
      # Config is committed (no secrets). Mosquitto 2.x listens localhost-only
      # without an explicit listener line — the file is required, not optional.
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "${LAN_IP}:${MOSQUITTO_PORT}:1883"
    restart: unless-stopped

  # ── files: Syncthing (p2p sync — feeds ${MEDIA_ROOT} from phones/PCs) ─────────
  syncthing:
    image: syncthing/syncthing:${SYNCTHING_IMAGE_TAG}
    container_name: syncthing
    profiles: ["syncthing"]
    volumes:
      - syncthing_data:/var/syncthing
      - ${MEDIA_ROOT}:/media
    ports:
      - "${LAN_IP}:${SYNCTHING_GUI_PORT}:8384"     # web UI (set a GUI password!)
      - "${LAN_IP}:22000:22000/tcp"                # sync protocol
      - "${LAN_IP}:22000:22000/udp"
      - "${LAN_IP}:21027:21027/udp"                # local discovery
    restart: unless-stopped

  # ── quality-of-life: RSS, recipes, LAN dashboard ─────────────────────────────
  freshrss:
    image: freshrss/freshrss:${FRESHRSS_IMAGE_TAG}
    container_name: freshrss
    profiles: ["freshrss"]
    environment:
      TZ: ${TIMEZONE}
      CRON_MIN: "13,43"     # built-in feed refresh (twice hourly)
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
    ports:
      - "${LAN_IP}:${FRESHRSS_PORT}:80"
    restart: unless-stopped

  mealie:
    image: ghcr.io/mealie-recipes/mealie:${MEALIE_IMAGE_TAG}
    container_name: mealie
    profiles: ["mealie"]
    environment:
      TZ: ${TIMEZONE}
      BASE_URL: http://${LAN_IP}:${MEALIE_PORT}
      ALLOW_SIGNUP: "false"
    volumes:
      - mealie_data:/app/data
    ports:
      - "${LAN_IP}:${MEALIE_PORT}:9000"
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_IMAGE_TAG}
    container_name: homepage
    profiles: ["homepage"]
    environment:
      # Required since v0.9.2 — requests with any other Host are rejected.
      HOMEPAGE_ALLOWED_HOSTS: ${LAN_IP}:${HOMEPAGE_PORT}
    volumes:
      # Config lives in the volume (YAML, edited in place); no docker.sock on
      # purpose — the discovery widgets aren't worth socket access here.
      - homepage_config:/app/config
    ports:
      - "${LAN_IP}:${HOMEPAGE_PORT}:3000"
    restart: unless-stopped

  # ── ops: diun — pinned-image update NOTIFIER (closes the stale-pin gap) ───────
  # The Q10.9 B+ flip side: pins never drift, but security patches never arrive
  # unless someone looks (the oauth2-proxy v7.6.0 lesson, review 2026-07-10).
  # diun watches every running container's registry tag and NOTIFIES (never
  # auto-updates — Watchtower would violate the pin philosophy). Pair with the
  # ntfy profile: notifications land on your own push channel.
  diun:
    image: crazymax/diun:${DIUN_IMAGE_TAG}
    container_name: diun
    profiles: ["diun"]
    environment:
      TZ: ${TIMEZONE}
      DIUN_WATCH_SCHEDULE: "0 6 * * *"             # daily 06:00 check
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true" # all containers unless diun.enable=false
      DIUN_NOTIF_NTFY_ENDPOINT: ${DIUN_NTFY_ENDPOINT}
      DIUN_NOTIF_NTFY_TOPIC: ${DIUN_NTFY_TOPIC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - diun_data:/data
    restart: unless-stopped

  # ── gunmaster3-relay — the family crossplay relay ────────────────────────────
  #
  # ── HOW IT IS TURNED ON, AND IT IS NOT `COMPOSE_PROFILES` ────────────────────
  # CHANGED 2026-08-29 (CROSSPLAY_HANDOFF.md §7). The enable knob is
  # **GAME_RELAY_ENABLED=true** in .env, the same convention as
  # REMOTE_UI_ENABLED and IMMICH_ML_ENABLED. The `profiles: ["gunmaster3"]` line
  # below STAYS, and its job is now the opposite of an enable switch: it is what
  # keeps this service OUT of firstboot's bulk `docker compose up -d`. The only
  # thing that ever passes `--profile gunmaster3` is
  # homehub-gunmaster3-relay.service, which `Requires=` the host fence.
  #
  # PUTTING `gunmaster3` INTO COMPOSE_PROFILES IS A DEFECT, not an alternative
  # spelling. It would let the bulk `up -d` start this container outside the
  # unit — no fence ordering, no secret validation, no artifact check — which is
  # precisely the failure the refresh exists to make unreachable. It is refused
  # by verify-hub.sh (TC-H-T07), scripts/ensure-local-images.sh and
  # vmtest/export-images.sh, each of which dies rather than warns.
  # WHAT IT IS: a ~300-line WebSocket relay from C:\Projects\FinnsGame\server. It
  # forwards presence and positions between two browsers so the Owner and his son
  # can see each other in Gun Master 3. It is not a game server: the world,
  # physics and rendering all stay client-side. It stores nothing, writes nothing
  # and makes no outbound calls — all three are properties of the code, and the
  # hardening below turns them into properties of the container.
  #
  # ── THIS IS THE ONLY SERVICE ON THE BOX THAT FACES THE INTERNET WITH NO ──────
  # ── IDENTITY CHECK IN FRONT OF IT, AND THAT IS A RULING, NOT AN OVERSIGHT ────
  #
  # The Owner, 2026-08-29: he wants to play with his son while away from home and
  # NOT on the VPN. That rules out the remote_ip gate that took actual.<domain>
  # and dns.<domain> off the internet the same day. The door is instead a SECRET
  # PATH — see the Caddyfile's game block, which carries the full reasoning and
  # the honest account of what a bearer token in a URL does and does not buy.
  #
  # WHY IT IS NOT basic_auth, since that is this box's convention for single-user
  # services: the browser WebSocket constructor CANNOT SET REQUEST HEADERS, so
  # there is nowhere to put Authorization. The only browser route is credentials
  # embedded in the URL, which no spec requires and which would put the password
  # in the same text box the child types into.
  #
  # ── ITS OWN NETWORK, AND THAT NETWORK IS `internal: true` ────────────────────
  # The single most important line in this block. Every other container here
  # shares the default bridge, which is where the tracker, Actual and the finance
  # snapshots live. A public unauthenticated service does not belong on it: a
  # code-execution bug in this process would otherwise start life next to budget
  # data. The relay makes no outbound calls, so an internal network costs it
  # nothing at all — it cannot reach the internet, the LAN, or its neighbours.
  # Caddy joins both networks (see its `networks:` block) and is the only route
  # in.
  #
  # BUILD: locally, like naglight:local (Q10.2 — no registry yet). From a sibling
  # FinnsGame checkout:
  #     docker build -t gunmaster3-relay:local ../../FinnsGame/server
  gunmaster3-relay:
    image: gunmaster3-relay:${GAME_RELAY_IMAGE_TAG}
    container_name: gunmaster3-relay
    # NOT AN ENABLE SWITCH — see the banner above. This keeps the relay out of
    # the bulk `docker compose up -d`; homehub-gunmaster3-relay.service is the
    # only caller that ever passes `--profile gunmaster3`.
    profiles: ["gunmaster3"]
    labels:
      # Locally built, no registry home to watch — same reason as naglight:local.
      - "diun.enable=false"
    environment:
      PORT: "8367"
      MAX_PLAYERS: ${GAME_MAX_PLAYERS}
      NAME: ${GAME_RELAY_NAME}
      # A29 (2026-08-30): the relay's OWN door, on top of Caddy's secret path.
      # Ships blank and blank is safe - the relay reads empty as "no key" and
      # stays open, i.e. exactly today's behaviour. Declared here so the hub
      # KNOWS the knob: the relay grew it upstream and nothing on this side
      # would otherwise have noticed (open-items A28).
      GAME_CONNECT_KEY: ${GAME_CONNECT_KEY}
    networks:
      - game
    # expose, NOT ports: nothing publishes this to the host. Caddy reaches it
    # across the `game` network by container name and is the only thing that can.
    expose:
      - "8367"
    # ── hardening: every line below is free, because the relay already does none
    # of the things they forbid. That is the point — it makes "it stores nothing"
    # structural instead of behavioural, so a bug cannot leave a payload behind.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bounds the ONE real DoS vector in the relay: sockets that connect and never
    # say hello are held for HELLO_TIMEOUT_MS (5s) and are NOT counted against
    # MAX_PLAYERS, because capacity is checked in handleHello. A flood therefore
    # grows file descriptors regardless of the player cap. Caddy's rate_limit
    # (120 upgrades/min/IP) is the first line; these are the backstop.
    pids_limit: 128
    mem_limit: 192m
    # ── `no`, AND IT MUST BE `no` RATHER THAN `on-failure` ────────────────────
    # CHANGED 2026-08-29 from `unless-stopped` (CROSSPLAY_HANDOFF §7). SYSTEMD
    # OWNS THIS CONTAINER'S LIFECYCLE NOW — homehub-gunmaster3-relay.service,
    # which `Requires=` the host fence — and two owners is the same as none.
    #
    # `unless-stopped` was the defect: it made DOCKER start the relay on every
    # boot, before and independently of the fence, so the fence unit failing
    # could not stop the relay coming back. `Before=docker.service` on the fence
    # orders the starts but cannot propagate the failure; `Requires=` on the
    # relay unit can, and only if Docker is not also starting it behind systemd's
    # back.
    #
    # AND NOT `on-failure`, which looks like the cautious choice and is not.
    # Docker restarts on-failure containers at DAEMON START when their last exit
    # was non-zero, and a SIGTERM'd node process exits 143 — so the ordinary
    # `systemctl stop` of this unit would arm a resurrection at the next boot,
    # performed by dockerd, outside the unit, with no fence check between. `no`
    # is the whole point: nothing but the unit ever starts this container.
    restart: "no"
    healthcheck:
      # The image's own HEALTHCHECK hits /health on 127.0.0.1 — restated here so
      # the interval matches the rest of this file. /health is deliberately NOT
      # routed by Caddy: it answers access-control-allow-origin:* and would
      # confirm to any scanner that a relay lives at that name. Nothing is lost —
      # this probe runs inside the container.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8367/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── networks ─────────────────────────────────────────────────────────────────
# `default` is implicit and unchanged: every service that names no network still
# lands on it, which is all of them but the two below.
networks:
  default:
  # The relay's isolation boundary. Caddy is dual-homed and is the only path in.
  # Do NOT add a second service here without re-reading the gunmaster3-relay
  # banner: the value of this network is that exactly one untrusted thing sits
  # on it.
  #
  # ── READ THIS BEFORE TRUSTING `internal: true` ───────────────────────────────
  # It does LESS than its name suggests, and the first version of this file
  # claimed more than it delivers. `internal: true` removes the default route,
  # so there is genuinely no path to the internet, the LAN, or the other
  # compose networks — all measured. **It does NOT stop the container reaching
  # the HOST**, which still owns the bridge address, and Docker documents that
  # exception. Measured 2026-08-29 from inside the relay: 172.x.0.1:22 (SSH),
  # :53 and :5380 (Technitium — HOST-networked, so its admin console was
  # reachable straight past Caddy's LAN gate AND its basic_auth) and :9090 all
  # answered. Found by an adversarial review (gpt-5.6-sol), then confirmed by
  # connecting, not by reading.
  #
  # THE SUBNET IS PINNED so a firewall rule can name it. A dynamically-allocated
  # subnet moves, and a host rule naming last week's range is a rule that
  # silently protects nothing. The host-side REJECT lives in
  # stack/game-isolation/ and is what actually closes the hole; this pin is the
  # half that makes it addressable.
  game:
    internal: true
    ipam:
      config:
        - subnet: 172.28.90.0/24

volumes:
  ddns_data:
  technitium_config:
  caddy_data:
  caddy_config:
  tracker_data:
  actual_data:
  uptimekuma_data:
  ntfy_data:
  ntfy_cache:
  # finance-auditor (IF-004): snapshots are LAN-only PRIVATE finance data —
  # back up via volume: source, NEVER offsite; the api cache is re-creatable.
  finance_snapshots:
  finance_actual_data:
  # tier-2 opt-in volumes (SR-012) — created only when a profile first starts.
  immich_db:
  immich_model_cache:
  photoprism_storage:
  photoprism_db:
  jellyfin_config:
  jellyfin_cache:
  navidrome_data:
  audiobookshelf_config:
  audiobookshelf_metadata:
  vaultwarden_data:
  homeassistant_config:
  mosquitto_data:
  syncthing_data:
  freshrss_data:
  mealie_data:
  homepage_config:
  diun_data:
