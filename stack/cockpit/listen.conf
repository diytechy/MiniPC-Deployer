# cockpit.socket drop-in: Cockpit on IPv4 loopback only (ADMIN_PORTAL_PLAN
# 2026-09-22, decision D-A3). Installed by firstboot.sh as
# /etc/systemd/system/cockpit.socket.d/listen.conf.
#
# Cockpit is a sudo-capable shell in a browser and used to answer on :9090 on
# every interface, the tailnet included. It is now reached over SSH only:
#     ssh -L 9090:127.0.0.1:9090 hub@homehub   ->   https://localhost:9090
#
# THE EMPTY ListenStream= IS LOAD-BEARING. ListenStream is list-valued and a
# drop-in ADDS to a list, so without the reset the packaged `ListenStream=9090`
# (all interfaces) stays and this line only adds a second listener. This is the
# form Cockpit's own guide gives (cockpit-project.org/guide/latest/listen).
#
# NO [::1]:9090, deliberately. A socket unit whose listener cannot be bound
# fails as a whole, and on a kernel booted with ipv6.disable=1 (or with v6 off
# on lo) [::1] cannot be bound - so the extra line could take the IPv4 listener
# down with it, leaving no Cockpit at all. The tunnel above uses 127.0.0.1, so
# the v6 loopback listener would buy nothing.
[Socket]
ListenStream=
ListenStream=127.0.0.1:9090
