# /etc/asound.conf — the panel's audio graph, with no sound server.
#
# THE PANEL HAS NO PipeWire AND NO PulseAudio. Every client opens ALSA directly,
# so sharing has to be arranged here or not at all.
#
# TWO MODES, SWITCHED BY `wall-audio-mode trigger|panel`. The output chain lives
# in /etc/wall-panel/audio-out.conf, a symlink to one of the two mode files, and
# is included at the end of this file. `pcm.!default` is static in ALSA config,
# so the mode cannot be a pure mixer change -- switching swaps the symlink,
# applies a mixer table and restarts the passthrough.
#
# ONE AUDIBLE OUTPUT in trigger mode (settled by measurement 2026-09-12, and
# narrowed by the 2026-09-13 ruling): the USB adapter's line out carries
# everything audible, to the amplifier, and the built-in ALC255 carries nothing.
#
# The ALC255 used to carry a continuous trigger tone for a far-end rectifier,
# because it is the louder part (2.6 V tip-ring against the adapter's 0.29 V at
# 440 Hz full scale, anti-phase) even though it is the noisier one by a wide
# margin -- loopback floors at identical capture gain were -42.5 dBFS for the
# ALC255 against -73.0 for the adapter, and the ALC255's noise is downstream of
# every control it has (identical at Master 100/79/40/0% and identical again
# when MUTED). That tone is RETIRED: the LCUS-2 USB relay is the only amplifier
# actuator, so amplifier power no longer depends on any PCM at all, which is
# strictly better than the old decoupling argument (the adapter's mute switch is
# pswitch-joined across its channels, so a trigger carried there would have died
# with any mute).
#
# The consequence for this file: the built-in codec has NO PCM defined on it in
# trigger mode. It is reserved, unopened, for the headset leg of the audio
# routing redesign (HomeHub item 23). The 2026-09-12 pin dump in
# stack/panel-audio/README.md is why that leg is output-only: node 0x21 has no
# capture path, so a headset mic must come from the USB adapter or Bluetooth.
#
# ONE PLAYBACK SUBSTREAM. There is no hardware mixing; the first process to open
# the raw device locks out every other one. The kiosk plays Pandora and the
# local library, and alsaloop holds its playback device continuously, so without
# dmix they cannot coexist -- the passthrough would silence the kiosk outright.
#
# ipc_gid IS NOT COSMETIC. alsaloop runs as root, so without it these IPC
# segments are created root:root 0660 and every non-root client -- the kiosk
# included -- fails with:
#     ALSA lib pcm_direct.c:2195:(_snd_pcm_direct_new) unable to create IPC semaphore
#     audio open error: Permission denied
# 29 is the audio group on Ubuntu 24.04; `ipcs -m -c` confirms the result.
# Anything that opens these PCMs must be in that group.
#
# THE TWO ipc_key VALUES MUST BE FAR APART. ALSA offsets a direct plugin's key
# by the card and device it attaches to, so keys that merely differ by one
# collide once both plugins sit on the SAME device -- which is the case here,
# since input and output are both the adapter. dmix wins the race and creates
# its segment; dsnoop then asks for the same key at a different size and shmget
# returns EINVAL:
#     ALSA lib pcm_direct.c:2195:(_snd_pcm_direct_new) unable to create IPC shm instance
#     capture linein_shared open error: Invalid argument
# Either plugin alone works, which makes this look like a capture-side bug when
# it is really a collision. 7710 and 8820 are deliberately nowhere near each
# other. If you ever change one, check `ipcs -m` for a key clash.
#
# CLEAR THE IPC SEGMENTS AFTER EDITING THIS FILE. dmix and dsnoop keep their
# parameters in the shared segment, and a segment left over from the previous
# configuration is reused rather than rebuilt. After one such change, clients
# read a stale layout and got garbage that looked convincingly like a signal:
# 94000 of 96000 samples pinned at -1, one real sample every ~48, and only 16
# distinct values per channel. Nothing errored, and it was analysed as though it
# were real before anyone noticed.
#
#     systemctl stop wall-line-in
#     ipcs -s | awk '/0x0000/ {print $2}' | xargs -r -n1 ipcrm -s
#     ipcs -m | awk '/0x0000/ {print $2}' | xargs -r -n1 ipcrm -m
#     systemctl start wall-line-in
#
# Sanity check after any change here: a capture of real audio should show
# thousands of distinct sample values. A few dozen means a stale segment.
#
# Input and output for the audio path are the same USB device, so they share a
# clock and alsaloop has no drift to correct.

# Line-in, shared so the trigger detector can read the same signal alsaloop
# passes through. Common to both modes.
pcm.linein_shared {
    type dsnoop
    ipc_key 8820
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "card_usb"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# WHICH CARD IS WHICH lives in exactly one place, and it is generated. Card ids
# appear nowhere else in this stack: everything below refers to `card_usb`,
# `card_builtin` and the loopback by name, so swapping the USB adapter for a
# different model is a knob in wall.env rather than an edit across five files.
# Verified that a named hw PCM works as a dmix/dsnoop slave, not just through
# plug.
</etc/wall-panel/audio-cards.conf>

# The output chain: speaker_shared, the mode-specific extras, pcm.!default and
# ctl.!default. A missing symlink leaves the panel with no default PCM, which is
# loud in the logs rather than silently wrong.
</etc/wall-panel/audio-out.conf>
