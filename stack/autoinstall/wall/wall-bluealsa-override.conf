# Drop-in for the packaged bluealsa.service. Installed as
# /etc/systemd/system/bluealsa.service.d/wall.conf by configure-bluetooth.sh.
#
# FOUR PROFILES, AND THIS FILE USED TO ARGUE FOR TWO. It ran
# `-p a2dp-sink -p hfp-hf` and said at length why a source profile was wrong.
# That argument was right for the panel as it then was, and the half of it that
# still holds is kept below rather than deleted.
#
# ── The two the panel has always had: it is the thing you play INTO ──────────
#
# `a2dp-sink` is music from a phone or a laptop, landing on the ALSA default
# PCM and so in front of the amplifier's own detector, with no knowledge of
# Bluetooth anywhere in that detector.
#
# `hfp-hf` makes the panel the gateway's HANDS-FREE UNIT -- its headset --
# which is item 23 spec A: "Bluetooth connects as headset mic input and as
# speaker output". Not `hfp-ag` in THAT relationship, which would make the
# panel the telephone and the phone the headset, i.e. the other way round.
#
# ── The two added 2026-09-19, so the panel can HAVE a headset ───────────────
#
# `a2dp-source` and `hfp-ag` are the mirror image: they let the panel play out
# to, and take a microphone from, a Bluetooth headset that IT connects to.
# That is Goal 2 of the 2026-09-19 plan, and the Owner ruled for it: "whatever
# is necessary so that the work computer can connect to the panel as a
# passthrough gateway, and then the panel can connect to a bluetooth headset."
#
# ONE ADAPTER HOLDS BOTH ROLES, and that is not a compromise. Bluetooth
# negotiates per peer, so a laptop takes the panel's HF/sink side while a
# headset takes its AG/source side. Measured on the panel 2026-09-19 with all
# four enabled: bluealsa started clean and the dev PC still negotiated
# `hfphf`, unchanged.
#
# ── What the old comment feared, and what is actually true ──────────────────
#
# It feared a source profile "would let a phone pull audio off the panel", and
# that is still the thing to be careful about. What makes it acceptable now is
# that nothing unbonded can connect at all: bonding requires a window opened
# deliberately at the glass and, since 2026-09-19, a six-digit number shown
# while it happens.
#
# BE HONEST ABOUT THE RESIDUAL. Enabling the profile does NOT by itself confine
# the source role to a device the panel selected. Any BONDED device may ask,
# and bluealsa will offer. Narrowing it to the chosen output device is policy
# and belongs in the applier, not in a profile list. SR-025 records it as a
# residual rather than implying it away here.
#
# ── The cost the Owner accepted on 2026-09-13 (review finding 4) ────────────
#
# HFP and A2DP are the same radio link at different times. While a call is up
# the link is HFP -- mono, 8 or 16 kHz -- and A2DP music is suspended; it
# resumes when the call ends. That is what the profiles are, not a defect to be
# tuned out. It now applies in both directions.
#
# ── What adding a profile does NOT do ───────────────────────────────────────
#
# It routes nothing on its own. The panel's microphone reaches a call only
# while wall-bt-call.service is running, and the far end reaches the room's bus
# only when that same supervisor's second leg is enabled by
# WALL_BT_SCO_PLAYBACK.
#
# A DEVICE PAIRED BEFORE A PROFILE EXISTED WILL NOT HAVE NEGOTIATED IT. It has
# to reconnect -- Bluetooth off and on at the device is enough -- before the
# matching endpoint appears. That is measured, not theoretical: a phone paired
# before `hfp-hf` existed connected A2DP-only and would not carry a call until
# it was forgotten on both sides and re-paired. So THIS CHANGE OBLIGES A
# RE-PAIR of every device that is to use the new roles, and wall-bt-call.py
# finding nothing meanwhile is correct and quiet behaviour.
#
# ExecStart must be cleared before being set again; that is a systemd rule for
# overriding a unit's command, not a stylistic choice here.

[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-sink -p a2dp-source -p hfp-hf -p hfp-ag
