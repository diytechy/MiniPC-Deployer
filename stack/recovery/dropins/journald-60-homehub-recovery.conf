# Installed by firstboot step 6g to /etc/systemd/journald.conf.d/. ALWAYS ON (C6).
# Persistent, and capped: the hub's journal is what the next RCA reads.
# 4G equals the cap journald already applies on this box's 57 GB root (10 % of
# the filesystem, at most 4G), so pinning it changes no live behaviour.
[Journal]
Storage=persistent
SystemMaxUse=4G
