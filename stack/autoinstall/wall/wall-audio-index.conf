# Pin ALSA card order (2026-09-12). Card indexes are assignment-order, and
# across a reboot the USB line-in adapter came up as card 0 with the built-in
# ALC255 as card 1 — which silently repoints a bare ALSA `default` at the
# adapter's own output jack instead of the amplifier feed.
#
# The built-in codec is the panel's speaker path, so it takes index 0.
options snd_hda_intel index=0
options snd_usb_audio index=1
