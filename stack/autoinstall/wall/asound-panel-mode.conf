# Panel mode — everything plays out of the panel's own speaker. The adapter's
# line output is unpowered and the amplifier is not commanded at all.
#
# A FALLBACK, NOT AN EQUAL CHOICE: this path measured 31 dB noisier than the
# adapter (-42.5 dBFS against -73.0 at identical capture gain), and here it
# carries the audio rather than a trigger tone.
#
# There is no loopback and no trigger_out in this mode. The trigger daemon reads
# /etc/wall-panel/audio-mode, sees `panel`, and idles without opening anything.

pcm.speaker_shared {
    type dmix
    ipc_key 7712
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "card_builtin"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.!default {
    type plug
    slave.pcm "speaker_shared"
}

# Card ids come from audio-cards.conf; see asound.conf.
ctl.!default "card_builtin_ctl"
