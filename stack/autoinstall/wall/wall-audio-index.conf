# Pin ALSA card order (2026-09-12). Card indexes are assignment-order, and
# across a reboot the USB line-in adapter came up as card 0 with the built-in
# ALC255 as card 1 — which silently repoints a bare ALSA `default` at the
# adapter's own output jack instead of the amplifier feed.
#
# The built-in codec is the panel's speaker path, so it takes index 0.
options snd_hda_intel index=0
# -2: any free index ABOVE zero. It was index=1, which assumed ONE USB card;
# with the headset adapter plugged in at boot the second USB card raced the
# Intel codec for index 0 and won, and snd_hda_intel then failed to probe at
# all ("cannot find the slot for index 0 (range 0-2)", panel, 2026-09-13
# 23:55). Everything addresses cards by id, so the USB indexes do not matter.
options snd_usb_audio index=-2
