# /etc/systemd/journald.conf.d/zz-wall-no-syslog-forward.conf on the WALL
# PANEL -- installed by wall-firstboot.sh on every boot (SR-083).
#
# rsyslog.service and syslog.socket are masked on the panel (firstboot step
# 8f): there is no syslog daemon to forward to, so journald should not offer
# every message to a socket nobody reads.
#
# WHY A SEPARATE FILE WITH THIS NAME. systemd ships
# /usr/lib/systemd/journald.conf.d/syslog.conf with ForwardToSyslog=yes, and
# drop-ins are merged in FILE-NAME order across /etc, /run and /usr/lib, the
# last one winning. Put in 10-wall-cap.conf this line would sort before
# syslog.conf and lose (shown with systemd-analyze cat-config under systemd
# 255); "zz-" sorts after it.
[Journal]
ForwardToSyslog=no
