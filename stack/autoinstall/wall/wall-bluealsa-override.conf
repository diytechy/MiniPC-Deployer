# Drop-in for the packaged bluealsa.service. Installed as
# /etc/systemd/system/bluealsa.service.d/wall.conf by configure-bluetooth.sh.
#
# SINK ONLY. The stock unit runs `-p a2dp-source -p a2dp-sink`, which also
# offers to send the PANEL's audio to a connected phone. Nothing here wants
# that: the panel is the thing you play INTO, it has one speaker path and that
# path is wired to an amplifier. Advertising a source profile as well would put
# a second, confusing route in front of anyone pairing, and would let a phone
# pull audio off the panel -- a capability nobody asked for and which the
# broker's routing policy does not model.
#
# ExecStart must be cleared before being set again; that is a systemd rule for
# overriding a unit's command, not a stylistic choice here.

[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-sink
