# needrestart: restart NOTHING while the box is under a maintenance hold.
#
# Installed by firstboot 1d beside /usr/local/sbin/homehub-maintenance-hold,
# whose header carries the incident and the hold rules. HomeHub open-items C59.
#
# WHY A SECOND CALLER. The guard already skips the weekly unattended upgrade
# (an ExecCondition on apt-daily-upgrade.service), but needrestart also runs
# after EVERY manual `apt install` or `apt upgrade`, through apt's
# DPkg::Post-Invoke hook. On 2026-11-01 it was needrestart, not apt, that
# stopped the GParted units mid-move.
#
# THREE LAYERS, because needrestart has three ways to decide.
#
#   override_rc / override_cont catch-all 0: consulted per service at the moment
#     of an AUTOMATIC restart, whatever the mode; 0 means "list it instead".
#     Every stock entry is already 0, so the catch-all cannot contradict one.
#   The EFFECTIVE mode forced to 'l'. In INTERACTIVE mode override_rc only
#     pre-unticks the dialog, and ticking a GParted unit would still restart it.
#     $nrconf{restart} alone cannot stop that: needrestart 3.6 resolves its mode
#     AFTER reading this file, in this order -
#         $opt_r = $ENV{NEEDRESTART_MODE} if(!defined($opt_r) && exists($ENV{NEEDRESTART_MODE}));
#         $opt_r = $nrconf{restart} unless(defined($opt_r));
#     - so `-r i` (already parsed into $opt_r) or NEEDRESTART_MODE=i would win
#     (Codex review 2026-11-01 reproduced exactly that). Setting $main::opt_r
#     and deleting NEEDRESTART_MODE makes 'l' the answer to both lines, and in
#     list mode needrestart dispatches no restart at all (it only runs the
#     command when the mode is 'a', or after an interactive yes).
#   $nrconf{restart} = 'l' as well, for any needrestart that resolves its mode
#     differently: if $main::opt_r is ever renamed upstream, setting it is a
#     harmless no-op and the other two layers still stand.
#
# SCOPE: this stops needrestart. A package's own maintainer script still
# restarts that package's daemon - see the guard's header.
#
# FAIL SAFE. If the guard is missing or cannot answer, restarts are denied too.
# Nothing is lost: the new library is picked up at the next reboot, or by
# restarting the listed services by hand once the operation is over.
#
# HOMEHUB_MAINTENANCE_HOLD_BIN exists for the test suite only; apt runs
# needrestart as root, so only root could set it.
{
    my $guard = $ENV{HOMEHUB_MAINTENANCE_HOLD_BIN} || '/usr/local/sbin/homehub-maintenance-hold';
    # Captured, not system(): a clear verdict must not add a line to every
    # `apt install`. List-form open runs no shell, so the path needs no quoting.
    my ($out, $status) = ('', -1);
    if (open(my $verdict, '-|', $guard, 'check')) {
        local $/;
        $out = <$verdict> // '';
        close($verdict);
        $status = $?;
    }
    if ($status != 0) {
        print STDERR $out;
        print STDERR "needrestart: maintenance hold in force - no service or container will be restarted\n";
        $nrconf{override_rc}{qr(.)} = 0;
        $nrconf{override_cont}{qr(.)} = 0;
        $nrconf{restart} = 'l';
        $main::opt_r = 'l';
        delete $ENV{NEEDRESTART_MODE};
    }
}
