# Cadence override — the Owner, 2026-09-15.
#
# The storage map §4d one-minute cadence is far more often than this flow needs:
# the frame set is a handful of rendered videos that change rarely, and the run
# is NOT cheap. Measured this boot: 92 s of work per 152 s wall clock, i.e. the
# panel spends ~60% of its life mounting CIFS and walking an rsync tree at idle
# I/O priority while it is also drawing a UI and playing audio.
#
# NOT because runs were overlapping — they were not, and that matters. The base
# unit uses OnUnitInactiveSec, which measures from DEACTIVATION, so a run that
# overruns simply delays the next one; systemd never starts a second instance of
# a unit and there is no queue to drain. That was checked against the journal
# before this file was written (Failed 14:01:40 -> Starting 14:02:41 = exactly
# 61 s of idle, never a re-fire at zero delay). OnUnitInactiveSec is still the
# right knob for exactly that reason and is kept below.
#
# So this is a duty-cycle change, not a pile-up fix: 30 min between runs means
# the same 92 s run costs ~5% of the panel time instead of ~60%.
#
# SEPARATE FROM the frame sync ACTUAL BUG, which this does not fix: every run
# this boot has failed, hitting the 90 s rsync budget in wall-sync.sh (73
# failures, 0 successes). Reducing the cadence reduces the noise and the load;
# it does not make the mirror work. That still needs its own investigation.
[Timer]
# THE EMPTY ASSIGNMENT IS LOAD-BEARING. systemd treats OnUnitInactiveSec as a
# LIST, not a scalar: a drop-in that only sets 30min ADDS a second trigger
# alongside the base unit 1min one, and the EARLIEST wins -- so the cadence does
# not change at all. Measured: with only the 30min line, `systemctl list-timers`
# still showed NEXT 47s away. Resetting the list to empty first is what makes
# the override actually replace the base value.
OnUnitInactiveSec=
OnUnitInactiveSec=30min
