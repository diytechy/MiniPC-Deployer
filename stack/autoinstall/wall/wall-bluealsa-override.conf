# Drop-in for the packaged bluealsa.service. Installed as
# /etc/systemd/system/bluealsa.service.d/wall.conf by configure-bluetooth.sh.
#
# SINK ONLY, FOR MUSIC. The stock unit runs `-p a2dp-source -p a2dp-sink`, which
# also offers to send the PANEL's audio to a connected phone. Nothing here wants
# that: the panel is the thing you play INTO, it has one speaker path and that
# path is wired to an amplifier. Advertising a source profile as well would put
# a second, confusing route in front of anyone pairing, and would let a phone
# pull audio off the panel -- a capability nobody asked for and which the
# broker's routing policy does not model.
#
# PLUS `hfp-hf` (item 23 step 4, spec A and C). `hfp-hf` makes the panel the
# phone's HANDS-FREE UNIT -- its headset -- which is exactly what spec A asks
# for: "Bluetooth connects as headset mic input and as speaker output". It is
# NOT `hfp-ag`, which would make the panel the telephone and the phone the
# headset, i.e. the relationship the other way round.
#
# WHAT THIS COSTS, AND THE OWNER ACCEPTED IT ON 2026-09-13 (item 23 review
# finding 4). HFP and A2DP are the same radio link at different times. While a
# call is up the link is HFP -- mono, 8 or 16 kHz -- and A2DP music is
# suspended; it resumes when the call ends. That is not a defect to be tuned
# out, it is what the Bluetooth profiles are.
#
# WHAT IT DOES NOT DO. Adding a profile does not route anything on its own. The
# panel's microphone reaches the call only when wall-bt-mic.service is running,
# which the audio switch starts and which Owner ruling E's input mute stops. And
# the far end's voice does not reach the room's bus at all until somebody points
# bluealsa-aplay at the SCO profile as well -- a separate, deliberate change to
# a unit that is carrying music today, and not part of this step.
#
# A DEVICE PAIRED BEFORE THIS PROFILE EXISTED WILL NOT HAVE NEGOTIATED IT. The
# phone has to reconnect (Bluetooth off and on at the phone is enough) before an
# SCO endpoint appears. wall-bt-mic.py finding nothing is the correct and quiet
# behaviour meanwhile.
#
# ExecStart must be cleared before being set again; that is a systemd rule for
# overriding a unit's command, not a stylistic choice here.

[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -S -p a2dp-sink -p hfp-hf
