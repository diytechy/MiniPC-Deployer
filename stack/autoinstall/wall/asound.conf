# /etc/asound.conf — the panel's audio graph, with no sound server.
#
# THE PANEL HAS NO PipeWire AND NO PulseAudio. Every client opens ALSA directly,
# so sharing has to be arranged here or not at all.
#
# THE ALC255 HAS EXACTLY ONE PLAYBACK SUBSTREAM (measured 2026-09-12: there is
# only /proc/asound/card*/pcm0p/sub0). There is no hardware mixing to fall back
# on, so the FIRST process to open the raw device locks out every other one. The
# kiosk plays Pandora and the local library through this card, and alsaloop holds
# its playback device continuously, so without the dmix below they cannot
# coexist — the passthrough would silence the kiosk outright.
#
# WHY default IS PINNED TO PCH: card indexes are assignment-order, not stable.
# Across the 2026-09-12 reboot the USB adapter came up as card 0 and the ALC255
# as card 1, which silently repoints a bare `default` at the adapter's own output
# jack instead of the amplifier feed. modprobe.d/wall-audio-index.conf pins the
# order for future boots; naming the card by id here is what makes it correct
# even when it has not.
#
# ipc_gid IS NOT COSMETIC. alsaloop runs as root, so without it these IPC
# segments are created root:root 0660 and every non-root client — the kiosk
# included — fails with:
#     ALSA lib pcm_direct.c:2180:(_snd_pcm_direct_new) unable to create IPC semaphore
#     audio open error: Permission denied
# 29 is the audio group on Ubuntu 24.04; `ipcs -m -c` confirms the result.
# Anything that opens these PCMs must be in that group.
#
# THE TWO ipc_key VALUES MUST BE FAR APART (measured 2026-09-12). ALSA offsets a
# direct plugin's key by the card and device it attaches to, so keys that merely
# differ by one collide once both plugins sit on the SAME device — which is the
# case here, since input and output are both the adapter. dmix wins the race and
# creates its segment; dsnoop then asks for the same key at a different size and
# shmget returns EINVAL:
#     ALSA lib pcm_direct.c:2195:(_snd_pcm_direct_new) unable to create IPC shm instance
#     capture linein_shared open error: Invalid argument
# Either plugin alone works, which makes this look like a capture-side bug when
# it is really a collision. 7710 and 8820 are deliberately nowhere near
# each other. If you ever change one, check `ipcs -m` for a key clash.

# Speakers: the USB adapter's LINE OUTPUT, which is what feeds the amplifier.
# Shared so the kiosk and the line-in passthrough can both play.
#
# NOT THE ALC255 HEADPHONE JACK, measured 2026-09-12 by looping each output back
# into this adapter's line input at identical capture gain:
#     nothing connected (the input's own floor)   -75.0 dBFS
#     adapter line-out, idle                      -73.0
#     adapter line-out, stream active             -73.7
#     ALC255 headphone out                        -42.5
# The built-in headphone amplifier is a 31 dB noisier source, and that noise is
# downstream of every control the codec has: identical at Master 100%, 79%, 40%,
# 0%, and identical again with the output MUTED. No software setting touches it.
# The adapter's output measures at the input's own floor, so its real noise is
# below what this rig can resolve.
#
# A further benefit falls out: capture and playback are now the same USB device,
# so they share one clock and alsaloop has no drift to correct.
pcm.speaker_shared {
    type dmix
    ipc_key 7710
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "hw:ICUSBAUDIO7D,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# Line-in: the USB adapter's stereo input. Shared so the amplifier-trigger level
# detector can read the same signal alsaloop is passing through.
pcm.linein_shared {
    type dsnoop
    ipc_key 8820
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "hw:ICUSBAUDIO7D,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# The kiosk asks for `default`. It must reach the amplifier, at whatever rate and
# format Chromium happens to choose — hence the plug layer over the mix.
pcm.!default {
    type plug
    slave.pcm "speaker_shared"
}

ctl.!default {
    type hw
    card ICUSBAUDIO7D
}
