# Drop-in for the packaged bluealsa-aplay.service. Installed as
# /etc/systemd/system/bluealsa-aplay.service.d/wall.conf by
# configure-bluetooth.sh. This is the file that connects Bluetooth audio to the
# amplifier, and it does it by NOT being clever.
#
# THE WHOLE TRICK IS `default`.
#
# bluealsa-aplay writes to the ALSA `default` PCM. On this panel `default` is a
# symlink-selected include (`wall-audio-mode trigger|panel`), and in trigger
# mode it resolves to `kiosk_mix` -> snd-aloop -> `kiosk_monitor`, which is one
# of the two capture sources `panel-amp-trigger.py` already measures. So a phone
# playing to the panel raises the level the detector watches, the detector
# closes the relay, and the amplifier comes on -- with no change to the trigger
# daemon, no new source in its SOURCES table, and no second path to the relay.
#
# In panel mode `default` resolves to `speaker_shared` (the internal speaker)
# and the amplifier is not commanded at all, which is correct for that mode.
#
# So the PCM is deliberately NOT pinned to a card or to `kiosk_mix`: naming
# either would break the other mode, and following `default` is what makes
# Bluetooth obey `wall-audio-mode` like every other source on the box.

[Service]
# PrivateUsers REMAPS UIDS, AND dmix IS SysV SHARED MEMORY. The shared segments
# behind `kiosk_mix`/`speaker_shared` are created by the kiosk (uid 1000) with
# ipc_perm 0660 and ipc_gid 29 (audio); inside a user namespace this service's
# credentials are not the ones those permissions were written for, and attaching
# fails with EACCES. The unit already runs Group=audio precisely to pass that
# check, so the namespace is the thing that has to go.
PrivateUsers=false
# RemoveIPC would tear down SysV objects belonging to this service's user on
# exit. The dmix segments are shared with the kiosk and outlive this process;
# removing them would silence the panel's own audio when Bluetooth stopped.
RemoveIPC=false

# `--single-audio` keeps one stream at a time, which matches a single physical
# amplifier: two phones mixing into the same room is not a feature, it is an
# argument. `--profile-a2dp` is explicit rather than inherited.
ExecStart=
ExecStart=/usr/bin/bluealsa-aplay -S --profile-a2dp --single-audio --pcm=default
