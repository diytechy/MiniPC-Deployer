# Bus mode — item 23, steps 1-3. One merged stereo bus, then a switch, then
# (step 3) the 8-channel centre/sub route at the end of the speaker leg.
#
# Included by /etc/asound.conf through the /etc/wall-panel/audio-out.conf
# symlink, exactly like the two older modes. Switch with `wall-audio-mode bus`.
# TRIGGER MODE IS LEFT INTACT ON PURPOSE: this changes the live audio graph, so
# `wall-audio-mode trigger` remains a one-command rollback with the Owner in
# the room.
#
# THE SHAPE, IN ONE PARAGRAPH. Three sources (bluealsa-aplay, the desktop's
# S/PDIF through the 5.1 adapter's capture, and the kiosk) all open ONE dmix on
# the loopback's playback side; that is the bus. One dsnoop on the other end of
# the loopback is read by whichever leg the switch has chosen. The speaker leg
# goes through a SECOND loopback substream, which exists so the amplifier
# detector has something to read AFTER the switch (review finding 2) and BEFORE
# the volume control. The headset leg goes straight out the headset adapter.
#
# WHY NOT ONE dmix ON THE ADAPTER, AS TRIGGER MODE DOES. The three sources run
# on three different clocks -- A2DP is usually 44.1 kHz, the S/PDIF capture is
# the adapter's own 48 kHz, the kiosk is whatever it decodes -- and dmix cannot
# join clocks, only streams on one card. Owner ruling 9 keeps the existing
# alsaloop forwarder pattern, which resamples where the clocks meet. Every
# dmix/dsnoop below therefore has a slave on exactly ONE card.
#
# LATENCY, SAID OUT LOUD. Desktop audio used to take the direct path to the
# adapter precisely so lip-sync survived; in bus mode it cannot, because the
# Owner asked for one merged bus (spec B). The cost is the bus hop plus the leg
# hop, so the two forwarders in that path run at 30 ms rather than the kiosk's
# 100 ms, for about 60-80 ms end to end. If that reads as lip-sync error on the
# glass, the remedy is the trim in wall-spdif-in.service, not a second path.
#
# IPC KEYS ARE FAR APART for the reason asound.conf gives at length: ALSA
# offsets a direct plugin's key by card and device, so keys that merely differ
# by one collide once two plugins sit on the same device. 77xx are playback
# (dmix), 88xx capture (dsnoop), and none of them repeats a trigger-mode key.

# ── the bus ────────────────────────────────────────────────────────────────
# Every source opens this. `bus` (below) is the plug-wrapped name they use, so
# a 44.1 kHz A2DP stream does not have to match the bus rate.
pcm.bus_mix {
    type dmix
    ipc_key 7713
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "card_loop_play"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.bus {
    type plug
    slave.pcm "bus_mix"
}

# The readers of the bus. There are TWO of them, and this comment said "the
# single reader" until 2026-09-17 (SR-041, LLR-958):
#
#   1. whichever leg the switch has started -- wall-bus-speaker or
#      wall-bus-headset -- which is what actually carries the audio out; and
#   2. wall-bus-visualizer, which reads the same merged, PRE-switch stream to
#      publish bounded visualizer telemetry and, on demand, a bounded local PCM
#      stream for ProjectM.
#
# A SECOND READER IS WHAT dsnoop IS FOR, so this needed no change beyond the
# truth of the comment: the plugin exists precisely so several processes can
# read one capture. The visualizer's service takes ipc_gid 29 by
# SupplementaryGroups=audio, which is the only privilege the 0660 below asks of
# it. Note that the visualizer is PRE-switch and the amplifier detector is not:
# the detector reads `speaker_tap` further down, deliberately, because its job
# is the relay and it must see only the Speaker leg.
pcm.bus_monitor {
    type dsnoop
    ipc_key 8822
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "card_loop_cap"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# ── the speaker leg, and the detector's tap ────────────────────────────────
# wall-bus-speaker forwards bus_monitor to here; wall-speaker-out forwards
# speaker_tap to the adapter. The amplifier detector reads speaker_tap and
# nothing else, so it sees audio only while the switch is on Speaker, and it
# NEVER sees a source directly. It also sees the signal before the volume
# control, so turning the room down does not drop the amplifier out.
#
# When the switch leaves Speaker the forwarders stop, the tap goes quiet, and
# the detector's ordinary 4-minute hold-off runs: no immediate relay open,
# which is the Owner's amendment to finding 1. That behaviour is a CONSEQUENCE
# of the tap, not a special case in the daemon -- there is no mode logic in the
# actuator at all.
pcm.speaker_tap_mix {
    type dmix
    ipc_key 7714
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "card_loop_tap_play"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.speaker_tap {
    type dsnoop
    ipc_key 8823
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "card_loop_tap_cap"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# THE VOLUME CONTROL, AND WHY IT SITS HERE. Owner ruling F wants one level for
# the merged bus, remembered per output. The control is declared once, with the
# same name for both legs, on the LOOPBACK card -- which is always present, so
# the control survives a leg being stopped and an adapter being unplugged, and
# alsactl can persist it. It is applied at the END of each leg rather than on
# the bus itself for one measured reason: the detector's tap is upstream of it,
# so a quiet setting cannot silence the amplifier trigger. Only one leg is ever
# running, so there is still exactly one gain in the path.
pcm.speaker_out {
    type softvol
    # WHICH CHAIN, AND WHY IT IS NOT A CONSTANT (step 3). The default is the
    # 8-channel centre/sub chain. wall-audio-output probes it once per apply --
    # it opens the PCM with no frames, exactly as it already does to declare
    # this softvol -- and writes speaker_stereo into
    # /run/wall-panel/audio-speaker.env if the open fails, which
    # wall-speaker-out.service reads. ONE probe covers BOTH ways the multi
    # chain can be unavailable: an adapter that refuses the 8-channel altsetting
    # (a different model in the same role), and a missing or unparseable
    # /etc/wall-panel/audio-trim.conf, which is where speaker_multi is defined.
    # The fallback is exactly what shipped before step 3, so the worst case is
    # the panel we already had, with a journal line saying so.
    slave.pcm {
        @func getenv
        vars [ WALL_AUDIO_SPEAKER_CHAIN ]
        default "speaker_multi"
    }
    control {
        name "Bus Playback Volume"
        card "Loopback"
    }
}

# THE 8-CHANNEL OPEN (D4, superseding item 17). Measured on the panel
# 2026-09-13/14: the CM106 offers playback altsets of 2/4/6/8 channels at
# 44.1/48 kHz, and altset 1 is the 8-channel S16_LE one with the FIXED channel
# map FL FR FC LFE RL RR SL SR. `channels 8` on the slave is what selects it;
# the map is not negotiable and does not have to be, because it is already the
# order the ttable is written in.
#
# The plug is INSIDE this, not around speaker_out, so that the route plugin
# above it is handed a slave that is already 8 channels at 48 kHz S16_LE and
# has nothing left to convert.
# THE ADAPTER HAS ONE PLAYBACK STREAM AND STEP 4 GAVE IT A SECOND WRITER, so
# from here the eight channels are a dmix rather than a raw open.
#
# The 2026-09-18 physical pair probe found the desktop input on the adapter's
# SIDE pair (channels 6/7), despite the revision-2 plan naming the Rear jack.
# The selected mic feeds that measured pair. In Speaker position that has to happen
# WHILE the same adapter is playing the room's music out of the front, centre
# and sub channels -- and those are all channels of ONE eight-channel USB
# stream, which exactly one process may open. dmix is the only way two writers
# share it.
#
# THIS IS STILL A dmix WITH A SLAVE ON EXACTLY ONE CARD, which is the property
# Owner ruling 9 asks for and which a test asserts. Nothing is joined across
# cards here: both writers are already at the adapter's own 48 kHz by the time
# they arrive, and dmix sums per channel, so the speaker route's explicit zeros
# on channels 4-7 and the mic route's explicit zeros on 0-5 sum to
# exactly "music on the front, microphone on the rear, nothing crossing".
#
# THE RING IS 170 ms AND NOBODY HAS MEASURED WHAT THAT COSTS YET. 8192 frames
# at 48 kHz, with 21 ms periods. The speaker leg did NOT have this ring before
# step 4: it opened card_usb raw and alsaloop sized the buffer itself with
# --tlatency. A dmix ring is fixed and shared, so a client cannot shrink it, and
# how much of the 170 ms becomes end-to-end delay depends on how full alsaloop
# keeps it. Review (terra, 2026-09-14) flagged this and is right.
#
# It is NOT simply made smaller, and that is a decision: this leg has a MEASURED
# underrun problem (58 in the 2026-09-14 boot minute, which is why
# wall-speaker-out went from 30 ms to 50 ms) and NO measured latency problem.
# Trading a known fault for an unknown one without a measurement is how the
# first one was made. Acceptance step S4-14 measures it with the Owner; if it
# reads wrong, THIS buffer_size is the first number to move, and S3-9's underrun
# watch has to be repeated afterwards.
#
# ipc_key 7715 continues the 77xx playback block; see the key note at the top.
pcm.usb_out_mix {
    type dmix
    ipc_key 7715
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "card_usb"
        format S16_LE
        rate 48000
        channels 8
        period_size 1024
        buffer_size 8192
    }
}

pcm.speaker_hw8 {
    type plug
    slave.pcm "usb_out_mix"
}

# THE TRIM TABLE IS GENERATED, AND THIS IS WHERE IT ARRIVES. `speaker_multi` --
# the route that copies (L+R)/2 to FC and LFE -- is defined in
# /etc/wall-panel/audio-trim.conf, rendered by wall-firstboot.sh from the
# WALL_AUDIO_TRIM_* knobs and rewritten by `wall-audio-output trim`. It is
# separate from this file for the same reason audio-cards.conf is: the tuning
# session (finding 8, Owner: a dedicated effort after everything else) must be
# able to move six numbers without anybody editing ALSA syntax or reinstalling
# a payload file.
#
# `errors false` IS LOAD-BEARING. A plain `</...>` include of a file that is not
# there aborts the WHOLE configuration, which would take the bus, the headset
# leg and `default` down with it -- silence everywhere because a trim file went
# missing. With the hook, an absent file leaves `speaker_multi` undefined,
# the applier's probe fails, and the leg falls back to plain stereo.
# The mic leg's own generated file arrives the same way and for the same
# reason: /etc/wall-panel/audio-mic.conf is the only definition of
# `pcm.mic_rear_route`, rendered by `wall-audio-output mic` from the
# WALL_AUDIO_MIC_* knobs. ONE hooks block, two files, because a second top-level
# `@hooks` would replace this one rather than add to it.
@hooks [
    {
        func load
        files [
            { file "/etc/wall-panel/audio-trim.conf" errors false }
            { file "/etc/wall-panel/audio-mic.conf" errors false }
        ]
    }
]

# The fallback, and what shipped before step 3: the adapter's own default open,
# stereo out the front pair, no centre and no sub. Named so that the applier can
# select it by name rather than by rewriting configuration.
pcm.speaker_stereo {
    type plug
    slave.pcm "card_usb"
}

# ── the headset leg ────────────────────────────────────────────────────────
# THE CARD ID COMES FROM THE ENVIRONMENT because the headset adapter enumerates
# as the generic id "Device" -- which is what the kernel calls ANY nameless
# C-Media adapter -- and ALSA configuration cannot look a card up by USB id.
# wall-audio-output resolves 0d8c:0014 through /proc/asound/card*/usbid on
# every apply and writes /run/wall-panel/audio-headset.env, which the headset
# leg's unit reads. The default is the observed id, so a hand-run alsaloop
# still works.
pcm.headset_out {
    type softvol
    slave.pcm {
        type plug
        slave.pcm {
            type hw
            card { @func getenv vars [ WALL_AUDIO_HEADSET_CARD ] default "Device" }
            device 0
        }
    }
    control {
        name "Bus Playback Volume"
        card "Loopback"
    }
}

# ── the desktop's S/PDIF input ─────────────────────────────────────────────
# The adapter has exactly ONE 2-channel capture stream behind a four-way
# selector (Mic | Line | IEC958 In | Mixer), measured 2026-09-13. bus mode puts
# it on IEC958 In, which retires the 3.5 mm line-in BY CONSTRUCTION and means a
# wired mic cannot share this adapter -- the mic legs in step 4 come from the
# headset adapter or Bluetooth HFP.
#
# dsnoop rather than a raw open, for the same reason linein_shared was: more
# than one reader may need this signal (step 4's mic work, and the AEC spike's
# measurement loop), and an alsaloop holding the hardware locks them all out.
pcm.spdif_in {
    type dsnoop
    ipc_key 8824
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "card_usb"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# ── the mic legs (step 4: item 23 C, D3 and D4) ──────────────────────
# TWO CAPTURE DEVICES, ONE NAME. The switch position chooses which microphone is
# live -- the panel's own in Speaker and in Mute, the headset adapter's in
# Headset -- and `mic_selected` is the single name every consumer opens. The
# choice is published by wall-audio-output into
# /run/wall-panel/audio-mic-source.env and read here with `@func getenv`,
# exactly as the headset card id and the speaker chain already are.
#
# THE 5.1 ADAPTER IS NOT AN OPTION AND CANNOT BE. It has exactly one capture
# stream behind a four-way selector, and bus mode spends it on the desktop's
# S/PDIF (see spdif_in above). That measurement is the whole reason item 23
# revision 2 has a second USB adapter in it.
#
# WHY EVERYTHING BELOW IS MONO. Both destinations are mono by nature: an HFP SCO
# link is one 8 or 16 kHz channel, and a microphone fed to two rear channels
# should be the SAME microphone on both, not a stereo image of one capsule and
# some room. Mixing down here, once, means neither leg has to know.

# The panel's own microphone: ALC255 Analog capture on card PCH, which is the
# `card_builtin` of audio-cards.conf. The codec's own jack is output-only (the
# 2026-09-12 pin dump; HP Out node 0x21 has no capture path), so this is the
# INTERNAL microphone and nothing else -- `Capture Source` on that card is an
# exclusive enum reading `Internal Mic`, measured on the panel 2026-09-14.
#
# dsnoop, not a raw open, for the reason linein_shared and spdif_in are: the AEC
# work (D-3a) needs to read the same microphone as a measurement reference while
# a leg is forwarding it, and an alsaloop holding the hardware locks it out.
pcm.mic_panel_raw {
    type dsnoop
    ipc_key 8825
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "card_builtin"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# (L+R)/2, written out rather than left to `plug`'s channel conversion: plug's
# 2->1 behaviour is an implementation detail of alsa-lib and this is a signal
# that ends up on somebody's telephone call.
pcm.mic_panel {
    type route
    slave {
        pcm "mic_panel_raw"
        channels 2
    }
    ttable.0.0 0.5
    ttable.1.0 0.5
}

# The headset adapter's microphone: 0d8c:0014, ONE MONO capture channel, with an
# `Auto Gain Control` switch and no jack detection at all (measured
# 2026-09-13). The card id arrives in the environment for the same reason the
# headset OUTPUT leg's does: the kernel names any nameless C-Media part
# "Device", and ALSA configuration cannot look a card up by USB id.
pcm.mic_headset_raw {
    type dsnoop
    ipc_key 8826
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm {
            type hw
            card { @func getenv vars [ WALL_AUDIO_HEADSET_CARD ] default "Device" }
            device 0
        }
        format S16_LE
        rate 48000
        channels 1
        period_size 1024
        buffer_size 8192
    }
}

pcm.mic_headset {
    type plug
    slave {
        pcm "mic_headset_raw"
        format S16_LE
        rate 48000
        channels 1
    }
}

# ── the cancelled microphone (item 23 step 6) ────────────────────────────────
# `wall-audio-aec` opens the panel's raw microphone EXCLUSIVELY, cancels the
# room's own music out of it using `speaker_tap` as the far-end reference, and
# writes the result into card_loop_mic_play (Loopback device 0, subdevice 2 --
# the free one; 0 and 1 are the merged bus and the amplifier detector's tap).
# This is where it comes back out.
#
# dsnoop, not a raw open, for the same reason speaker_tap and spdif_in are: more
# than one consumer will want the microphone, and a raw open locks the rest out.
#
# NOTHING READS THIS DIRECTLY. It is reached through `mic_selected`, below, so
# that whether the canceller is in the path is one published environment value
# and not an edit to any unit.
pcm.mic_clean_raw {
    type dsnoop
    ipc_key 8827
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "card_loop_mic_cap"
        format S16_LE
        rate 48000
        channels 1
        period_size 1024
        buffer_size 8192
    }
}

pcm.mic_clean {
    type plug
    slave {
        pcm "mic_clean_raw"
        format S16_LE
        rate 48000
        channels 1
    }
}

# THIS NAME IS THE AEC INSERTION POINT AND IT EXISTS FOR THAT REASON. The AEC
# step (D-3a, step 6) puts a cancelled microphone PCM in front of both mic legs;
# it does that by making this one name resolve to `mic_clean` instead, which is
# ONE published environment value and no change to any unit, any script or any
# test of the legs themselves. Nothing downstream of here may ever open
# `mic_panel`, `mic_headset` or `mic_clean` directly.
pcm.mic_selected {
    type plug
    slave.pcm {
        @func getenv
        vars [ WALL_AUDIO_MIC_SOURCE ]
        default "mic_panel"
    }
}

# DESTINATION (a): the adapter's SIDE pair, which the 2026-09-18 tone probe
# proved is the jack wired to the desktop's audio input. `pcm.mic_rear_route`
# keeps its historical API name, but puts the mono microphone on channels 6 and
# 7 and EXPLICIT ZEROS on every other channel
# of the shared eight-channel stream -- is generated into
# /etc/wall-panel/audio-mic.conf by `wall-audio-output mic`, so that the one
# number worth tuning at a desk (how hot the desktop's line input wants to be
# driven) can move without anybody editing ALSA syntax. If that file is missing
# the hook above leaves this slave undefined, the applier's probe fails, and the
# rear leg simply does not run -- the speaker path is untouched either way.
pcm.mic_rear {
    type plug
    slave.pcm "mic_rear_route"
}

# Everything that plays -- the kiosk, bluealsa-aplay, an aplay in a shell --
# lands on the bus. bluealsa-aplay is deliberately NOT pinned to a card
# (SR-025); `default` is what carries it here.
pcm.!default {
    type plug
    slave.pcm "bus_mix"
}

# The 5.1 adapter's mixer is still the one a bare `amixer` should reach: it
# owns the physical outputs and the capture selector.
ctl.!default "card_usb_ctl"
