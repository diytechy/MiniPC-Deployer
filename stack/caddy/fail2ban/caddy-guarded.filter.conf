# caddy-guarded.conf — fail2ban filter for the two password-guarded Caddy sites.
#
# WHAT IT WATCHES. /var/log/caddy/access.log, which ONLY the guarded sites write
# to (the Caddyfile's (access_log) snippet is imported by actual.<domain> and
# dns.<domain> and by nothing else). So every line in this file is already a
# request to a site whose front door is a password, and there is no kiosk or
# tracker traffic to filter out first.
#
# WHY IT MATCHES 403 AS WELL AS 401, which looks wrong until you know the order
# the Caddyfile runs things in:
#
#   403  the remote_ip gate refused the caller before basic_auth ran. On these
#        two hosts that means "not on the LAN or the VPN" - i.e. the internet.
#        No legitimate user ever produces one, so it is the CLEANEST signal in
#        the file: somebody is knocking from outside.
#   401  the caller was inside the gate and got the password wrong. That is the
#        classic brute-force signal, and after the gate went in it can only come
#        from a device already on the LAN - a compromised laptop, a guest, an IoT
#        thing. A different threat, and still worth banning.
#
# Matching only 401 would have made this jail nearly inert: the gate turns every
# internet attempt into a 403, so the WAN attacker this was installed for would
# never trip a 401-only filter. Said out loud because that failure is silent -
# the jail would sit there reporting zero bans and looking healthy.
#
# THE REGEX IS DELIBERATELY LOOSE ABOUT KEY ORDER. Caddy's JSON writer is not
# contractually ordered, and a filter that silently stops matching after a Caddy
# upgrade is worse than no filter. It requires request.remote_ip and a status of
# 401 or 403 on the same line, and nothing about their positions.

[Definition]

failregex = ^\{.*"remote_ip":"<HOST>".*"status":(?:401|403)[,}]

ignoreregex =

# Caddy logs `ts` as a float epoch, not a formatted date. Without this fail2ban
# falls back to "time of reading", which mostly works and then silently stops
# working the moment the log is read out of order or replayed after a restart.
datepattern = "ts":{EPOCH}

[Init]

# The file is 0600 root; fail2ban runs as root, so no ACL is needed. Named here
# so a future reader does not go looking for a permission grant that is absent
# on purpose.
maxlines = 1
