# /etc/asound.conf — the panel's audio graph, with no sound server.
#
# THE PANEL HAS NO PipeWire AND NO PulseAudio. Every client opens ALSA directly,
# so sharing has to be arranged here or not at all.
#
# SIX CHANNELS, NOT TWO (2026-09-12). The adapter is a 5.1/7.1 device -- it
# offers 4-, 6- and 8-channel altsets -- and that spare capacity is used as a
# CONTROL LINE, not as surround sound. Front L/R carry everything audible; rear
# L/R carry a trigger tone for the amplifier's power relay and reach no speaker.
# See PANEL_AMP_AUTOPOWER.md in the HomeHub repo, option E.
#
# The alternative was detecting audio in analog off the amplifier feed, which
# fails because that feed is downstream of the volume control: sensitivity would
# change with the rocker, and quiet listening would never switch the amp on.
# Rear L/R are pinned at 0 dB independently -- the volume control carries 8
# separate values -- so the control line is immune to that.
#
# THE ALC255 HAS EXACTLY ONE PLAYBACK SUBSTREAM (measured 2026-09-12: there is
# only /proc/asound/card*/pcm0p/sub0). There is no hardware mixing to fall back
# on, so the FIRST process to open the raw device locks out every other one. The
# kiosk plays Pandora and the local library through this card, and alsaloop holds
# its playback device continuously, so without the dmix below they cannot
# coexist — the passthrough would silence the kiosk outright.
#
# WHY default IS PINNED TO PCH: card indexes are assignment-order, not stable.
# Across the 2026-09-12 reboot the USB adapter came up as card 0 and the ALC255
# as card 1, which silently repoints a bare `default` at the adapter's own output
# jack instead of the amplifier feed. modprobe.d/wall-audio-index.conf pins the
# order for future boots; naming the card by id here is what makes it correct
# even when it has not.
#
# ipc_gid IS NOT COSMETIC. alsaloop runs as root, so without it these IPC
# segments are created root:root 0660 and every non-root client — the kiosk
# included — fails with:
#     ALSA lib pcm_direct.c:2180:(_snd_pcm_direct_new) unable to create IPC semaphore
#     audio open error: Permission denied
# 29 is the audio group on Ubuntu 24.04; `ipcs -m -c` confirms the result.
# Anything that opens these PCMs must be in that group.
#
# THE TWO ipc_key VALUES MUST BE FAR APART (measured 2026-09-12). ALSA offsets a
# direct plugin's key by the card and device it attaches to, so keys that merely
# differ by one collide once both plugins sit on the SAME device — which is the
# case here, since input and output are both the adapter. dmix wins the race and
# creates its segment; dsnoop then asks for the same key at a different size and
# shmget returns EINVAL:
#     ALSA lib pcm_direct.c:2195:(_snd_pcm_direct_new) unable to create IPC shm instance
#     capture linein_shared open error: Invalid argument
# Either plugin alone works, which makes this look like a capture-side bug when
# it is really a collision. 7710 and 8820 are deliberately nowhere near
# each other. If you ever change one, check `ipcs -m` for a key clash.
#
# CLEAR THE IPC SEGMENTS AFTER EDITING THIS FILE (2026-09-12). dmix and dsnoop
# keep their parameters in the shared segment, and a segment left over from the
# previous configuration is reused rather than rebuilt. After the 2ch->6ch
# change, clients kept reading a stale layout and got garbage that looked
# convincingly like a signal: 94000 of 96000 samples pinned at -1, one real
# sample every ~48, and only 16 distinct values per channel. Nothing errored.
# A whole analysis was run on that before anyone noticed it was not audio.
#
#     systemctl stop wall-line-in
#     ipcs -s | awk '/0x0000/ {print $2}' | xargs -r -n1 ipcrm -s
#     ipcs -m | awk '/0x0000/ {print $2}' | xargs -r -n1 ipcrm -m
#     systemctl start wall-line-in
#
# Sanity check after any change here: a capture of real audio should show
# thousands of distinct sample values. A few dozen means a stale segment.

# The shared 6-channel mix. Channel order is FL FR FC LFE RL RR.
pcm.speaker6 {
    type dmix
    ipc_key 7710
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "hw:ICUSBAUDIO7D,0"
        format S16_LE
        rate 48000
        channels 6
        period_size 1024
        buffer_size 8192
    }
}

# Everything audible -- the kiosk and the line-in passthrough -- mixed onto FL/FR.
# Each client writes silence to the other four channels and dmix sums, so this
# and trigger_out coexist without either disturbing the other. Verified by
# playing a full-scale tone on trigger_out while the passthrough kept RUNNING.
pcm.amp_feed {
    type route
    slave.pcm "speaker6"
    slave.channels 6
    ttable.0.0 1
    ttable.1.1 1
}

# The amplifier's control line: RL=4, RR=5 -- the BLACK jack, confirmed by ear
# 2026-09-12 (a 440 Hz warbling tone on these channels was heard there and not
# on the others). The device itself cannot tell you this: its USB descriptors
# expose a single 8-channel `Speaker` output terminal with no per-jack naming,
# so the channel-to-jack mapping is convention plus this measurement, nothing
# more. Green is front L/R and carries everything audible.
#
# Fed an anti-phase pair so the signal
# taken ACROSS the two hot pins is double either one to ground (+6 dB), which is
# what lifts a rectified DC level toward the relay's trigger threshold.
#
# Tone leakage into the capture path is negligible: a full-scale 16 kHz tone here
# moved the input's 16 kHz bin from -111.7 to -101.0 dBFS and left the broadband
# floor unchanged.
#
# UNVERIFIED ELECTRICALLY. Routing and concurrency are measured; the actual
# output voltage at the jack is not, and every component choice in the trigger
# circuit scales from it. Measure before building.
pcm.trigger_out {
    type route
    slave.pcm "speaker6"
    slave.channels 6
    ttable.0.4 1
    ttable.1.5 1
}

# Line-in, shared so the level detector can read the same signal alsaloop passes
# through.
pcm.linein_shared {
    type dsnoop
    ipc_key 8820
    ipc_perm 0660
    ipc_gid 29
    slave {
        pcm "hw:ICUSBAUDIO7D,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

# The kiosk asks for `default`. It must reach the amplifier -- that is, FL/FR and
# never the control line -- at whatever rate and format Chromium chooses.
pcm.!default {
    type plug
    slave.pcm "amp_feed"
}

ctl.!default {
    type hw
    card ICUSBAUDIO7D
}
