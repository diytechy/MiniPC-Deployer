# needrestart: NEVER auto-restart xrdp or xrdp-sesman.
#
# Installed by stack/remote-ui/setup-remote-ui.sh. HomeHub open-items.md C59.
#
# WHY: restarting xrdp-sesman destroys its in-memory session table. Any live
# desktop session is ORPHANED — the Xorg keeps running under the old sesman
# (which detaches to PPID 1 and survives, because it still has a child), the
# NEW sesman cannot see it, and every later RDP connection therefore starts a
# SECOND session whose xfce4-session collides with the orphan on the shared
# user bus (/run/user/<uid>/bus, and xfce4-session is single-instance per bus)
# and exits after one second.
#
# What the operator sees: "the session almost starts, then closes immediately".
# What the log says: "Window manager (pid N, display 11) exited quickly (0
# secs). This could indicate a window manager config problem" — which is a RED
# HERRING. The window manager config is fine. The wedge is PERMANENT: there is
# no timeout and no reaper, so it lasts until a human kills the orphan by hand,
# and the visible error points at something that happened days later than the
# actual cause.
#
# MEASURED ON THE REAL HUB, 2026-09-01:
#   06:54:16  apt-daily-upgrade.service starts
#   06:54:30  Upgrade: libbz2-1.0   <- the ONLY package
#   06:54:33  needrestart stops/starts xrdp.service + xrdp-sesman.service
#   09:54:45  session created on :11
#   09:54:46  ++ terminated session (one second later)
#
# `grep -c xrdp /var/log/apt/history.log` was ZERO — xrdp was never upgraded.
# needrestart restarted it purely because it LINKS AGAINST the upgraded
# library. apt-daily-upgrade.timer is DAILY, so without this file the desktop
# is one library patch away from wedging, with nobody touching the box.
#
# THE TRADE-OFF, STATED SO IT IS A CHOICE: xrdp keeps the OLD library mapped
# until the next reboot. Accepted because tcp/3389 is LAN-ONLY — never proxied
# through Caddy, never forwarded at the router (SN-005) — and the alternative
# is breaking every desktop session on any day a library xrdp links against
# gets patched. A reboot picks up the new library; nothing here defers security
# updates themselves, only the daemon restart.
#
# THIS DOES NOT REPLACE THE GUARD IN setup-remote-ui.sh (2aec278). That one
# makes the script's OWN restart conditional. It has no say over needrestart,
# apt, a package postinst, or an admin typing `systemctl restart xrdp` — which
# is the whole point: guarding callers one at a time cannot fix a class. This
# file removes the one caller that fires automatically, on a schedule. The
# class remains open; see C59.
$nrconf{override_rc}{qr(^xrdp(-sesman)?$)} = 0;
