# snd-aloop provides the loopback the trigger detector reads the kiosk's audio
# through. Index 2 keeps it clear of the pinned order in wall-audio-index.conf
# (built-in codec 0, USB adapter 1); a floating index would let ALSA's `default`
# drift onto the wrong card, which has happened here before.
options snd-aloop index=2 pcm_substreams=1
